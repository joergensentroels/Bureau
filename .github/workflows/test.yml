name: tests

# Authoritative test gate: runs on every push to main and every PR. Unlike the local pre-push hook,
# this can't be bypassed with --no-verify. Runs the pure + server suites via run-all --serve (which
# self-hosts a throwaway Bureau and generates its own token — no Latch, no secrets needed). The live
# --e2e suite is intentionally NOT run here: it needs Latch + a local LLM.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # BOTH PLATFORMS, because neither one alone is a superset and the gap is where the bugs hid.
    #
    # This ran on ubuntu-latest only, while the local pre-push hook runs on Windows. A test carrying a
    # platform assumption therefore passed the gate and failed the runner, or the reverse, and nobody
    # found out until someone opened the Actions tab. Measured: `closeSync(3)` guessed which descriptor
    # the log tee held -- correct on Windows, wrong on Linux -- and CI was red for TWELVE consecutive runs
    # across three days on a public repository while every local push reported green.
    #
    # fail-fast: false because the whole point is to see BOTH answers. Cancelling the second leg the moment
    # the first one fails would reproduce exactly the blind spot this matrix exists to remove.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # bash on both. The steps below use PIPESTATUS, tee, grep, sed and awk; windows-latest defaults to
    # pwsh, where none of that parses. Git Bash ships on the Windows runners, so one shell covers both and
    # the scripts stay single-sourced rather than forked per platform.
    defaults:
      run:
        shell: bash
    steps:
      # v7 on both — current, and the reason to leave v4 was the RUNTIME: v4 of each declares `using: node20`,
      # which the runners no longer offer. They force it onto node24 and announce it as deprecated on every
      # run. Read out of each action.yml rather than assumed: v4 is node20, v5/v6/v7 are all node24. Needs a
      # runner at v2.327.1+, which GitHub-hosted ubuntu-latest is.
      #
      # What the majors after v4 change that could touch this workflow, checked rather than skimmed:
      #   checkout    v6 moves credentials to a separate file; v7 blocks checking out a FORK PR under
      #               `pull_request_target` and `workflow_run`. This one triggers on `push` and
      #               `pull_request`, so that restriction does not reach it. Nothing here sets fetch-depth,
      #               and the shallow default is unchanged — the suites do not read git history.
      #   setup-node  v5 added automatic caching when package.json carries a `packageManager` field, and v6
      #               narrowed that to npm only. This repo has no such field and no dependencies at all, so
      #               it is off either way. v7 adds cache outputs and drops a dummy NODE_AUTH_TOKEN export;
      #               nothing here publishes.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"   # node:sqlite (DatabaseSync) + node --test
      - name: Run tests (pure + server, self-hosted)
        # The failure is echoed into an ANNOTATION as well as the log, because reading the log needs a
        # signed-in session with admin rights on the repo and reading an annotation does not. This workflow
        # was red for ten days across four commits while the notification email said only "All jobs have
        # failed" and the run page said "Sign in to view logs" — the gate fired correctly every time and
        # reported nothing anyone could act on. A gate you cannot read is a gate people learn to ignore.
        run: |
          set +e
          TMP_OUT="${RUNNER_TEMP:-/tmp}/test-output.txt"
          TMP_REPORT="${RUNNER_TEMP:-/tmp}/test-report.txt"
          node test/run-all.mjs --serve 2>&1 | tee "$TMP_OUT"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # The FAILING lines first, then the tail. A tail alone is the wrong 80 lines: the suites print one line
            # per assertion, so the end of the output is whatever ran last, not what went wrong. The first version
            # of this annotation showed twenty consecutive ticks under the words "suite failed".
            { grep -nE '^(✗|not ok|FAILURES|  FAIL )' "$TMP_OUT" | head -40
              echo "-- last 40 lines --"
              tail -40 "$TMP_OUT"
            } > "$TMP_REPORT"
            body=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' "$TMP_REPORT" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Test suite failed on ${{ matrix.os }} (exit $code)::$body"
          fi
          exit $code
        env:
          OPERATOR_TOKEN: ci-operator-token   # shared by the self-hosted server + the test clients
      # Gate item 3, and now actually a gate. This ran as `|| true` while TESTING.md stated the rule as
      # "no new export/endpoint ships without a test or a ledger entry" — so the rule was enforced by
      # nobody. The escape hatch when something is covered through its caller is writing the ledger line
      # that says so, not skipping the step. Annotated for the same reason the suite above is: the log
      # needs a signed-in session with repo admin to read, and an annotation does not.
      - name: Coverage audit (every export + /api + /mcp route is tested or in the TESTING.md ledger)
        run: |
          node test/coverage-audit.mjs || {
            echo "::error title=Coverage audit failed on ${{ matrix.os }}::An export or route is neither referenced by a test nor listed in TESTING.md. Add a test, or add a ledger entry with the reason."
            exit 1
          }
