name: tests

# Authoritative test gate: runs on every push to main and every PR. Unlike the local pre-push hook,
# this can't be bypassed with --no-verify. Runs the pure + server suites via run-all --serve (which
# self-hosts a throwaway Bureau and generates its own token — no Latch, no secrets needed). The live
# --e2e suite is intentionally NOT run here: it needs Latch + a local LLM.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # node:sqlite (DatabaseSync) + node --test
      - name: Run tests (pure + server, self-hosted)
        # The failure is echoed into an ANNOTATION as well as the log, because reading the log needs a
        # signed-in session with admin rights on the repo and reading an annotation does not. This workflow
        # was red for ten days across four commits while the notification email said only "All jobs have
        # failed" and the run page said "Sign in to view logs" — the gate fired correctly every time and
        # reported nothing anyone could act on. A gate you cannot read is a gate people learn to ignore.
        run: |
          set +e
          node test/run-all.mjs --serve 2>&1 | tee /tmp/test-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            body=$(tail -80 /tmp/test-output.txt | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Test suite failed (exit $code)::$body"
          fi
          exit $code
        env:
          OPERATOR_TOKEN: ci-operator-token   # shared by the self-hosted server + the test clients
      - name: Coverage audit (soft — reports untested exports/routes, never fails the build)
        run: node test/coverage-audit.mjs || true
