  const list=(data&&data.sops)||[];
  if(!list.length){ box.innerHTML=`<div class="dim">No processes yet. An SOP is a named, ordered checklist the company runs step-by-step — it skips the AI planning step, so recurring work runs the same way every time.</div>`; return; }
  box.innerHTML=list.map(s=>{ const n=(s.steps||[]).length;
    return `<div class="delivrow" style="cursor:default"><span>📋</span>
      <span style="flex:1;min-width:0"><span class="dn" style="display:block;white-space:normal">${esc(s.name)}</span><span class="dim" style="font-size:11px">${n} step${n===1?"":"s"}${s.description?" · "+esc(s.description.slice(0,70)):""}</span></span>
      <button class="rvbtn" data-act="run" data-id="${s.id}">▶ Run</button>
      <button class="rvbtn" data-act="edit" data-id="${s.id}">Edit</button>
      <button class="rvbtn" data-act="del" data-id="${s.id}" title="Delete">✕</button></div>`;
  }).join("");
  box.querySelectorAll(".rvbtn").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.id, act=b.dataset.act;
    if(act==="run"){ b.textContent="…"; try{ const {runId}=await api("POST","/api/sops/"+id+"/run",{autoApprove:false}); streamRun(runId); }catch{ b.textContent="▶ Run"; } }
    else if(act==="edit"){ openSopDialog(list.find(x=>x.id===id)); }
    else if(act==="del"){ if(confirm("Delete this process?")){ await api("DELETE","/api/sops/"+id); loadSops(); } }
  });
}
function openSopDialog(sop){
  const isEdit=!!sop;
  const opts=`<option value="">(anyone / by role)</option>`+(ORG.agents||[]).map(a=>`<option value="${esc(a.name)}">${esc(a.name)} — ${esc(a.role)}</option>`).join("");

  wrap.innerHTML=`<div class="modal" style="max-width:620px">

      <div><label>Name</label><input id="sopName" placeholder="Publish a blog post"></div>
      <div><label>Description (optional)</label><textarea id="sopDesc" placeholder="What this process produces and when to run it."></textarea></div>

        <button id="sopAddStep" style="margin-top:6px">+ Add step</button></div>

  const stepsBox=wrap.querySelector("#sopSteps");
  const renumber=()=>{ [...stepsBox.children].forEach((r,i)=>{ const n=r.querySelector(".sopNum"); if(n) n.textContent=(i+1)+"."; }); };

    const row=el("div","row"); row.style.cssText="gap:6px;margin-bottom:6px;align-items:center";
    row.innerHTML=`<span class="sopNum dim" style="width:18px;text-align:right;font-size:12px"></span>

      <select class="sopWho" style="max-width:190px">${opts}</select>

    renumber();
  };
  wrap.querySelector("#sopName").value=isEdit?(sop.name||""):"";
  wrap.querySelector("#sopDesc").value=isEdit?(sop.description||""):"";
  if(isEdit&&(sop.steps||[]).length) sop.steps.forEach(s=>addRow(s.task,s.assignee)); else { addRow(); addRow(); }
  wrap.querySelector("#sopAddStep").onclick=()=>addRow();
  wrap.onclick=e=>{ if(e.target===wrap) wrap.remove(); };
  wrap.querySelector("#sopCancel").onclick=()=>wrap.remove();
  const del=wrap.querySelector("#sopDel"); if(del) del.onclick=async()=>{ if(confirm("Delete this process?")){ await api("DELETE","/api/sops/"+sop.id); wrap.remove(); loadSops(); } };
  wrap.querySelector("#sopSave").onclick=async()=>{
    const name=wrap.querySelector("#sopName").value.trim(); if(!name){wrap.querySelector("#sopName").focus();return;}
    const steps=[...stepsBox.children].map(r=>({task:r.querySelector(".sopTask").value.trim(),assignee:r.querySelector(".sopWho").value})).filter(s=>s.task);
    if(!steps.length){ alert("Add at least one step with a task."); return; }

    try{ if(isEdit) await api("PATCH","/api/sops/"+sop.id,body); else await api("POST","/api/sops",body); }catch{ alert("Couldn't save."); return; }
    wrap.remove(); loadSops();

  wrap.querySelector("#sopName").focus();

function critList(items, showStatus){
  return `<div class="dodlist">`+(items||[]).map(c=>{
    const st=c.status||"open"; const ic=st==="met"?"✓":st==="unmet"?"✗":"○";
    return `<div class="dodrow ${st}"><span class="dodic">${ic}</span><span><span class="dodt">${esc(c.text)}</span>${showStatus&&c.note?`<span class="dodn">${esc(c.note)}</span>`:""}</span></div>`;
  }).join("")+`</div>`;
}
function handleEvent(ev){
  const d=ev.data||{};
  const dep=d.depth||0;
  const who=(n)=>d.agent?`${esc(d.agent)} · ${n}`:n;
  if(ev.type==="start"){
    if(d.company) addEv("","company objective",`<div>${esc(d.objective)} <span class="dim">→ Manager</span></div>`);
    else addEv("","objective set",`<div>${esc(d.objective)} <span class="dim">→ ${esc(d.agent)} (${esc(d.role)})</span></div>`);
    if(d.hush) addEv("","🤫 hush task",`<div class="dim">Local model only — no agent may use the paid/external LLM for this task, whatever its budget.</div>`);
  }
  else if(ev.type==="plan"){
    addEv("plan",`${esc(d.manager||"manager")} · delegates`,
      `${d.plan?`<div style="margin-bottom:6px">${esc(d.plan)}</div>`:""}
       <div class="propbox">${d.tasks.map((t,i)=>`<div style="${i?'border-top:1px dashed var(--line-2);padding-top:6px;margin-top:6px':''}"><b>${esc(t.agent)}</b> <span class="dim">${esc(t.role)}</span><div class="muted" style="font-size:12px">${esc(t.task)}</div></div>`).join("")}</div>`, dep);
  }
  else if(ev.type==="assign") addEv("assign",`${esc(d.by||"manager")} → ${esc(d.agent)}`,`<div class="muted" style="font-size:12px">${esc(d.task)}</div>${d.handoffFrom&&d.handoffFrom.length?`<div class="dim" style="font-size:11px;margin-top:4px">↪ handed ${esc(d.handoffFrom.join(", "))}'s work</div>`:""}`, dep);
  else if(ev.type==="ask_peer") addEv("assign",`${esc(d.by)} → ${esc(d.to)}`,`<div class="propbox"><div class="t">🗣 asks ${esc(d.role||"teammate")}</div><div class="muted" style="font-size:12px;margin-top:4px">${esc(d.question)}</div></div>`, dep);
  else if(ev.type==="question"){ addEv("plan",d.duplicate?`❓ already queued`:`❓ a question for you`,`<div><b>${esc(d.question||"")}</b></div><div class="muted" style="font-size:12px;margin-top:3px">Nothing is waiting on it — proceeding as if: ${esc(d.assumption||"")}${d.affects?` · written in ${esc(d.affects)}`:""}</div>`, dep); loadQuestions(); }
  else if(ev.type==="lens") addEv("assign",`round ${d.round||"?"}`,`<div class="dim" style="font-size:11px">🔎 hunting with the <b>${esc(d.lens||"")}</b> lens — the criteria already passed, so this is looking for what they never described</div>`, dep);
  else if(ev.type==="finding") addEv("approved",`🐞 finding · ${esc(d.cls||"?")}`,`<div><b>${esc(d.claim||"")}</b></div><div class="muted" style="font-size:12px;margin-top:3px">${esc(d.where||"")} — proved by <code>${esc(d.check||"")}</code>: it failed on the current code, passed with the fix, and failed again when the fix was reverted</div>`, dep);
  else if(ev.type==="findingRejected") addEv("blocked",`↩ claim refused`,`<div>${esc(d.claim||"")}</div><div class="muted" style="font-size:12px;margin-top:3px">${esc(d.reason||"")}</div>`, dep);
  else if(ev.type==="round") addEv("say",`round ${d.round||"?"} · ${esc(d.lens||"")}`,`<div class="dim" style="font-size:12px">${d.confirmed?`${d.confirmed} confirmed`:"nothing new"}${d.dryRounds?` · ${d.dryRounds} quiet round(s) in a row`:""}</div>`, dep);
  else if(ev.type==="investigated") addEv("done",`🔎 investigation over`,`<div><b>${d.findings||0}</b> confirmed, <b>${d.refused||0}</b> refused, over ${d.rounds||0} round(s) — stopped because ${esc(d.stoppedBecause||"")}</div>`, dep);
  else if(ev.type==="peer_answer") addEv("approved",`${esc(d.from)} → ${esc(d.to)}`,`<div class="dim" style="font-size:11px;margin-bottom:3px">💬 replied</div><div>${esc(d.text)}</div>`, dep);
  else if(ev.type==="say") addEv("say",who(`turn ${d.turn}/${d.maxTurns}`),`<div>${d.paid?`<span title="this turn ran on the paid API" style="color:var(--accent);font-weight:600;font-size:11px;margin-right:5px">💳 ${d.paidModel?esc(d.paidModel):"paid"}</span>`:'<span title="this turn ran on the free local model" class="dim" style="font-size:11px;margin-right:5px">🖥️ local</span>'}${esc(d.speak)}</div>`, dep);
  else if(ev.type==="propose"){
    const latch=(HEALTH&&HEALTH.latchUrl)||"http://127.0.0.1:8787";
    addEv("propose",who("proposes action"),
      `<div class="propbox"><div class="t">${esc(d.title)} <span class="tag">${esc(d.actionType)}</span>${d.corrected?`<span class="tag" style="opacity:.7" title="auto-routed from the model's original choice">↻ from ${esc(d.corrected)}</span>`:""}</div>

  else if(ev.type==="result"){ const at=d.actionType;
    const meta={ file_write:{icon:"📄",ok:"saved file",fail:"save failed"}, web_search:{icon:"🔎",ok:"web search (worker VM)",fail:"search failed"}, read_file:{icon:"📖",ok:"read past document",fail:"read failed"}, purchase:{icon:"🛒",ok:"purchase authorized",fail:"purchase failed"}, shell:{icon:"⌨️",ok:"ran command (worker VM)",fail:"command failed"}, api_call:{icon:"🔌",ok:"API call",fail:"API call failed"} }[at]||{icon:"🌐",ok:"fetched web page",fail:"fetch failed"};
    const okDetail = at==="file_write"?`${d.bytes.toLocaleString()} bytes written to ${esc(d.url)}`
      : at==="read_file"?`read ${esc(d.url)} back to the agent to revise`
      : at==="purchase"?`${esc(d.url)} deducted from the company budget`
      : at==="web_search"?`${d.bytes.toLocaleString()} chars of real results returned to the agent`
      : `${d.bytes.toLocaleString()} chars of real content returned to the agent`;
    addEv(d.ok?"approved":"error", who(d.ok?meta.ok:meta.fail),`<div>${meta.icon} ${esc(d.url||"")}</div><div class="dim" style="font-size:11px;margin-top:3px">${d.ok?okDetail:esc(d.error)}</div>`, dep); }
  else if(ev.type==="timeout") addEv("denied",who("timed out"),`<div class="dim">No decision within the wait window.</div>`, dep);
  else if(ev.type==="finish") addEv("finish",who("finished"),`<div>${esc(d.summary)}</div>`, dep);
  else if(ev.type==="escalate"){
    const latch=(HEALTH&&HEALTH.latchUrl)||"http://127.0.0.1:8787";
    addEv("escalate",who("asks the CEO"),
      `<div class="propbox"><div class="t">Question for you</div><div class="muted" style="font-size:12px;margin-top:4px">${esc(d.question)}</div></div>
       ${d.autoApprove?`<div class="waiting">no CEO in playtest — proceeding on best judgment…</div>`
                      :`<div class="waiting">⏳ waiting for your answer in <a href="${latch}" target="_blank">Latch ↗</a></div>`}`, dep);
  }
  else if(ev.type==="answer") addEv(d.denied?"denied":"approved", who(d.denied?"no answer from CEO":"CEO answered"),`<div>${esc(d.text)}</div>`, dep);
  else if(ev.type==="report") addEv("report",`${esc(d.manager||"manager")} · report`,`<div>${esc(d.text)}</div>`, dep);
  else if(ev.type==="criteria") addEv("dod","QA · definition of done",`<div class="dim" style="font-size:11px;margin-bottom:5px">${(d.items||[]).length} acceptance criteria, set before any work begins</div>${critList(d.items,false)}`, dep);
  else if(ev.type==="planreview"){
    const items=d.items||[];
    const e=addEv("plan","Plan · your approval before work starts",`<div class="dim" style="font-size:12px;margin-bottom:6px">Review the acceptance criteria (one per line). Edit if you want, then approve — or reject to cancel this run before any work happens.</div><textarea class="planedit" id="planEdit">${esc(items.map(c=>c.text).join("\n"))}</textarea><div class="row" style="gap:8px;margin-top:8px"><button class="primary" id="planApprove">Approve &amp; run</button><button id="planReject">Reject</button></div><div class="dim" id="planMsg" style="font-size:11px;margin-top:6px"></div>`);
    const ap=e.querySelector("#planApprove"), rj=e.querySelector("#planReject"), msg=e.querySelector("#planMsg");
    ap.onclick=async()=>{ ap.disabled=rj.disabled=true; const crit=e.querySelector("#planEdit").value.split("\n").map(s=>s.trim()).filter(Boolean); try{ await api("POST","/api/run/"+CUR_RUN+"/plan",{decision:"approve",criteria:crit}); msg.textContent="Approved — starting work…"; }catch{ msg.textContent="Couldn't send approval."; ap.disabled=rj.disabled=false; } };
    rj.onclick=async()=>{ ap.disabled=rj.disabled=true; try{ await api("POST","/api/run/"+CUR_RUN+"/plan",{decision:"reject"}); msg.textContent="Rejected — cancelling."; }catch{ msg.textContent="Couldn't send."; ap.disabled=rj.disabled=false; } };
  }
  else if(ev.type==="planapproved") addEv("approved","plan approved",`<div class="dim">Work starting on the approved criteria.</div>`);
  else if(ev.type==="planrejected") addEv("denied","plan rejected",`<div class="dim">Run cancelled — no work was done.</div>`);
  else if(ev.type==="paused"){ RUN_PAUSED=true; const pb=$("#pauseBtn"); if(pb) pb.textContent="▶ Resume"; addEv("dod","⏸ paused by you",`<div class="dim">Agents hold at their next turn. Send a steer, then resume.</div>`); }
  else if(ev.type==="resumed"){ RUN_PAUSED=false; const pb=$("#pauseBtn"); if(pb) pb.textContent="⏸ Pause"; addEv("approved","▶ resumed",`<div class="dim">Agents continue.</div>`); }
  else if(ev.type==="steered") addEv("report","🧭 course correction",`<div>${esc(d.text)}</div><div class="dim" style="font-size:11px;margin-top:3px">Each active agent folds this in on its next turn.</div>`);
  else if(ev.type==="verify"){ const cls=d.unmet?"dodfail":"dodpass";
    addEv(cls,`QA · verification${d.attempt?` · pass ${d.attempt+1}`:""}`,`<div style="font-size:12px;margin-bottom:5px"><b>${d.met}/${d.total}</b> criteria met${d.unmet?` · <span style="color:var(--danger)">${d.unmet} unmet</span>`:` · <span style="color:var(--ok)">all clear</span>`}</div>${critList(d.items,true)}`, dep); }
  else if(ev.type==="remediate") addEv("dod","QA · sending back",`<div class="dim" style="font-size:12px;margin-bottom:3px">${d.unmet.length} item${d.unmet.length===1?"":"s"} kicked back to the team to fix:</div><div class="dodlist">${d.unmet.map(t=>`<div class="dodrow unmet"><span class="dodic">↩</span><span class="dodt">${esc(t)}</span></div>`).join("")}</div>`, dep);
  else if(ev.type==="blocked") addEv("denied",who("blocked by guardrail"),`<div class="dim">⛔ ${esc(d.actionType||"action")} — ${esc(d.reason||"not permitted")}</div>`, dep);
  else if(ev.type==="dryrun") addEv("dod","dry run — preview only",`<div class="dim">🔮 Simulating: you'll see the plan and the actions the team WOULD take. Nothing real happens — no files, approvals, calls, or spend.</div>`);
  else if(ev.type==="dryaction") addEv("say",who("would "+esc(d.actionType||"act")),`<div class="dim" style="font-size:12px">🔮 ${esc(d.title||"")}${d.command?` <span class="cmd">${esc(String(d.command).slice(0,120))}</span>`:d.details?` — ${esc(d.details)}`:""}</div>`, dep);
  else if(ev.type==="error") addEv("error",who("error"),`<div>${esc(d.message)}</div>`, dep);
  else if(ev.type==="budget"){ $("#budget").textContent=(d.totalTokens||0).toLocaleString();
    const paidLine = d.ranPaid
      ? ` · <span style="color:var(--accent);font-weight:600">💳 ${fmtUsdFine(d.paidSpentUsd||0)} on the paid model (${((d.paidTokens||0)/1000).toFixed(1)}k tok)</span>`

        shortfall:{c:"dodfail",t:`⚠ Shortfall — ${d.met}/${d.total} criteria met`,s:`${d.unmet} still unmet after a remediation pass. Flagged for you in the Inbox.`},

      if(m) addEv(m.c,`definition of done · ${esc(d.verdict)}`,`<div style="font-size:13px"><b>${m.t}</b></div><div class="dim" style="font-size:11px;margin-top:3px">${m.s}</div>`);
    }
    if(ES)ES.close(); resetRun(); loadDeliverables(); loadPurchases(); loadDashboard(); loadGoals(); loadPlan(); refreshInbox(); api("GET","/api/org").then(o=>{ORG=o; render();}).catch(()=>{});

// ---- live agent status ----
let STATUS={}, LAST_MEETING_SIG="";
async function pollStatus(){ try{ STATUS=await api("GET","/api/agent-status"); paintStatus(); }catch{} }
function statesMap(){ return (STATUS && STATUS.states) || {}; }
function paintStatus(){
  const states=statesMap();
  document.querySelectorAll(".statusline[data-agent]").forEach(elm=>{
    const s=states[elm.getAttribute("data-agent")];
    if(!s){ elm.className="statusline"; elm.innerHTML=""; return; }
    elm.className="statusline "+(s.state==="waiting"?"st-wait":"st-work");
    elm.innerHTML=`<span class="pdot"></span>${s.state==="waiting"?"waiting":"working"}`;
  });
  // office: department rooms. Re-render when the meeting membership changes (people move to
  // the Meeting Room), then reflect per-worker status in place.
  if(orgView()==="office"){
    const ob=document.getElementById("orgbody");
    const sig=((STATUS&&STATUS.meeting)||[]).slice().sort().join(",");
    if(ob && sig!==LAST_MEETING_SIG){
      LAST_MEETING_SIG=sig; ob.innerHTML=officeHTML(); wireFloor(ob);
    }
  }
  document.querySelectorAll(".rchar[data-node]").forEach(w=>{
    const st=states[w.dataset.node];
    w.classList.toggle("st-work", !!st && st.state==="working");
    w.classList.toggle("st-wait", !!st && st.state==="waiting");
  });
  document.querySelectorAll(".deskscreen[data-node]").forEach(s=>{
    const st=states[s.dataset.node];
    s.classList.toggle("st-work", !!st && st.state==="working");
    s.classList.toggle("st-wait", !!st && st.state==="waiting");
  });
}

    <div class="dim" style="margin-bottom:14px">Describe the company you want to build. ${esc(hrName)} will propose the team to make it real.</div>
    <div class="fields">
      <div><label>Company vision</label><textarea id="vinput" placeholder="Build and host a SaaS product for small businesses.">${esc(ORG.vision||"")}</textarea></div>
      <div class="row" style="justify-content:flex-end"><button class="primary" id="vgo">Ask ${esc(hrName)} to design the org</button></div>
    </div>
    <div id="vplan" style="margin-top:6px"></div>
    <div class="row" id="vfoot" style="justify-content:space-between;margin-top:16px;display:none">
      <span class="dim" id="vhint"></span>
      <div class="row" style="gap:10px"><button id="vcancel">Close</button><button class="primary" id="vhire">Hire selected</button></div>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  let plan=null;
  const foot=$("#vfoot",wrap), planBox=$("#vplan",wrap);
  const updateHire=()=>{ const n=wrap.querySelectorAll(".planrow input:checked").length; $("#vhire",wrap).textContent=`Hire selected (${n})`; $("#vhire",wrap).disabled=n===0; };
  $("#vgo",wrap).onclick=async()=>{
    const vision=$("#vinput",wrap).value.trim(); if(!vision){$("#vinput",wrap).focus();return;}
    const go=$("#vgo",wrap); go.disabled=true; go.textContent=`${esc(hrName)} is thinking…`;
    try{
      plan=await api("POST","/api/hr/plan",{vision});
      if(!plan.roles||!plan.roles.length){ go.textContent="try again"; go.disabled=false; return; }
      planBox.innerHTML=`<div class="hrbanner" style="margin-top:10px"><b>${esc(hrName)}:</b> ${esc(plan.summary||"Here's the team I'd build.")}</div>`
        +`<div class="planlist">${plan.roles.map((r,i)=>`<label class="planrow"><input type="checkbox" data-i="${i}" checked>
            <div><div><b>${esc(r.name||r.title)}</b> <span class="dim">— ${esc(r.title)} · reports to ${esc(r.reportsTo||"CEO")}</span></div>
            ${r.why?`<div class="muted" style="font-size:12px;margin-top:2px">${esc(r.why)}</div>`:""}
            <div class="chips" style="margin-top:5px">${(r.traits||[]).map(t=>`<span class="chip on" style="cursor:default">${esc(t)}</span>`).join("")}</div></div></label>`).join("")}</div>`;
      go.textContent="Re-design"; go.disabled=false;
      foot.style.display="flex"; $("#vhint",wrap).textContent=`${plan.roles.length} roles proposed`;
      wrap.querySelectorAll(".planrow input").forEach(cb=>cb.onchange=updateHire); updateHire();
    }catch{ go.textContent="try again"; go.disabled=false; }
  };
  $("#vcancel",wrap).onclick=()=>wrap.remove();
  wrap.onclick=(e)=>{ if(e.target===wrap) wrap.remove(); };
  $("#vhire",wrap).onclick=async()=>{
    const picks=[...wrap.querySelectorAll(".planrow input:checked")].map(cb=>plan.roles[+cb.dataset.i]);
    if(!picks.length) return;
    $("#vhire",wrap).disabled=true; $("#vhire",wrap).textContent="Hiring…";
    await api("POST","/api/hr/hire-plan",{roles:picks});
    wrap.remove(); ORG=await api("GET","/api/org"); render();
  };
  $("#vinput",wrap).focus();
}

// ---- hire / edit modal (shared) ----
function openAgentModal(mode, agent, opts){
  opts=opts||{};
  const isEdit=mode==="edit"; agent=agent||{};
  let chosen=new Set(isEdit?(agent.traits||[]):[]);
  let isHR = isEdit ? !!agent.hr : (opts.hrMode==="bootstrap");
  const exclude=isEdit?new Set([agent.id,...descendantIds(agent.id)]):new Set();
  const mgrOpts=`<option value="">You (CEO)</option>`+ORG.agents.filter(a=>!exclude.has(a.id)).map(a=>`<option value="${a.id}"${isEdit&&(agent.managerId||"")===a.id?" selected":""}>${esc(a.name)} — ${esc(a.role)}</option>`).join("");
  const banner = opts.hrMode==="bootstrap"
    ? `<div class="hrbanner">Every hire goes through HR — but you don't have one yet. Make your first hire your <b>HR lead</b>; you (the CEO) hire this one directly.</div>`
    : opts.hrMode==="viaHR"
    ? `<div class="hrbanner" id="hrb">Hiring is handled by <b>${esc(opts.hrName)}</b> (HR). <button id="mask" class="ghost" style="padding:3px 9px;margin-left:4px">Ask ${esc(opts.hrName)} to suggest a candidate</button></div>`
    : "";
  const title = isEdit ? esc(agent.name) : (opts.hrMode==="bootstrap" ? "Hire your HR lead" : "Hire an agent");
  const wrap=el("div","modalwrap");
  wrap.innerHTML=`<div class="modal">
    <div class="row" style="gap:12px;align-items:center;margin-bottom:16px">
      ${isEdit?avatar(agent.seed,44):""}
      <h1 style="font-size:18px;margin:0;text-transform:none">${title}</h1>
      <span class="statusline" data-agent="${isEdit?agent.id:""}" style="position:static"></span>
    </div>
    ${banner}
    <div class="fields">
      <div><label>Role — free text, sent to the model</label>
        <input id="mrole" list="mroletpl" placeholder="Research Assistant, Growth Marketer, Legal Analyst…" value="${isEdit?esc(agent.role):""}">
        <datalist id="mroletpl">${Object.keys(TEMPLATES).map(r=>`<option value="${r}"></option>`).join("")}</datalist>
        <div class="chips" id="mtpl" style="margin-top:8px"></div></div>
      <div><label>Name</label><input id="mname" placeholder="Ada" value="${isEdit?esc(agent.name):""}"></div>
      <div><label>Reports to</label><select id="mmgr">${mgrOpts}</select></div>
      <div><label>Department</label><input id="mdept" list="mdeptlist" placeholder="Product & Technology" value="${isEdit?esc(agent.department||""):""}">
        <datalist id="mdeptlist">${[...new Set(["Leadership","Product & Technology","Sales & Revenue","Marketing","Customer Success & Support","Security","Operations","People",...ORG.agents.map(a=>a.department).filter(Boolean)])].map(d=>`<option value="${esc(d)}"></option>`).join("")}</datalist></div>
      <div><label>Paid-API budget ($) — 0 = local model only</label><input id="mbudget" type="number" min="0" step="1" placeholder="0 (local model)" value="${isEdit&&agent.budgetUsd?agent.budgetUsd:""}"><div class="dim" style="font-size:11px;margin-top:4px">$0 keeps this agent on the free local model. A budget lets it use the paid API (once a provider is configured) up to that amount.</div></div>
      <div><label>Paid model tier <span class="dim" style="text-transform:none;letter-spacing:0;font-weight:400">— which paid model this agent uses when funded</span></label>
        <select id="mmodeltier">${Object.entries((HEALTH&&HEALTH.tiers)||{standard:{label:"Standard"},heavy:{label:"Heavy"}}).map(([v,t])=>`<option value="${v}" ${((isEdit&&agent.modelTier)||(HEALTH&&HEALTH.defaultTier)||"standard")===v?"selected":""}>${esc(t.label)}${t.pricePer1K?` · ~$${(t.pricePer1K*1000).toFixed(2)}/1M tok`:""}</option>`).join("")}</select>
        <div class="dim" style="font-size:11px;margin-top:4px">Seniority mechanic: a heavier tier is smarter but burns this agent's budget faster. Only matters when the budget is above $0.</div></div>
      <div><label>Allowed actions <span class="dim" style="text-transform:none;letter-spacing:0;font-weight:400">— none checked = all allowed</span></label>
        <div class="allowgrid" id="mallow">${[["web_search","🔎 Web search"],["web_research","🌐 Fetch page"],["file_write","📄 Write file"],["read_file","📖 Read file"],["purchase","🛒 Purchase"],["api_call","🔌 API call"],["shell","⌨️ Shell"],["github_file","🐙 GitHub publish"],["read_issues","🐙 Read issues"],["github_issue","🐙 Open issue"],["github_comment","🐙 Comment on issue"],["github_pr","🔀 Open pull request"]].map(([v,lbl])=>`<label class="allowchk"><input type="checkbox" value="${v}" ${isEdit&&(agent.allow||[]).includes(v)?"checked":""}>${lbl}</label>`).join("")}</div>
        <div class="dim" style="font-size:11px;margin-top:4px">Check specific actions to restrict this agent to only those. Blocked attempts are refused and logged.</div></div>
      <div><label>Autonomy tier <span class="dim" style="text-transform:none;letter-spacing:0;font-weight:400">— how much this agent may do without asking you</span></label>
        <select id="mtier">
          ${[["supervised","Supervised — everything waits for you (default)"],["trusted","Trusted — auto-approves safe reads & drafts under the $ ceiling"],["autonomous","Autonomous — auto-approves anything in its allowlist under the ceiling"]].map(([v,lbl])=>`<option value="${v}" ${((isEdit&&agent.tier)||"supervised")===v?"selected":""}>${lbl}</option>`).join("")}</select>
        <div class="dim" style="font-size:11px;margin-top:4px">🔒 Regardless of tier, <b>shell</b>, <b>API calls</b>, <b>sending email</b>, and spend <b>over your ceiling</b> ALWAYS require your approval.</div></div>
      ${isEdit?`<div><label>Coaching notes <span class="dim" style="text-transform:none;letter-spacing:0;font-weight:400">— one per line; injected into ${esc(agent.name)}'s prompts. Auto-added when you revise its work.</span></label><textarea id="mlessons" placeholder="Cite sources for every claim.&#10;Keep emails under 150 words.">${isEdit?esc((agent.lessons||[]).map(l=>l.text).join("\n")):""}</textarea></div>`:""}
      <div><label>Personality — free text, sent to the model</label>
        <textarea id="mpersona" placeholder="You are exacting and never ship sloppy work.">${isEdit?esc(agent.persona||""):""}</textarea></div>
      <div><label>Traits — free text, each one is sent to the model</label>
        <div class="chips" id="mtraits"></div>
        <input id="mtraitadd" placeholder="type a trait, press enter (e.g. perfectionist)" style="margin-top:8px"></div>
      <label class="row" style="text-transform:none;letter-spacing:0;color:var(--ink-2);gap:8px;cursor:pointer;margin:0"><input id="mhr" type="checkbox" style="width:auto"${isHR?" checked":""}> HR lead — this person runs hiring</label>
      <div><button id="madvtoggle" class="ghost" style="padding:4px 0;color:var(--accent-2)">Advanced ▾ full profile (markdown, sent to the LLM)</button></div>
      <div id="madv" class="hidden" style="display:flex;flex-direction:column;gap:10px">
        <div class="row" style="justify-content:space-between;align-items:center">
          <span class="dim" id="mbiostatus" style="font-size:11px">This is the actual document the LLM sees. Regenerates automatically when you change traits — or edit it by hand.</span>
          <button id="mbiogen" style="white-space:nowrap">Regenerate with AI</button>
        </div>
        <textarea id="mbio" style="min-height:220px;font-family:var(--mono);font-size:12px;line-height:1.5" placeholder="## Role &amp; mandate\n...">${isEdit?esc(agent.bio||""):""}</textarea>
      </div>
      ${isEdit&&(agent.memory||[]).length?`<div><label>Memory — what ${esc(agent.name)} remembers</label><div class="delivlist" style="max-height:170px;overflow:auto">${agent.memory.map(m=>`<div class="delivrow" style="cursor:default;flex-direction:column;align-items:flex-start;gap:2px"><div style="font-size:12px">${esc(m.objective)}</div><div class="dim" style="font-size:11px">${esc(m.summary||"")}</div>${(m.files||[]).length?`<div class="dim" style="font-size:11px">📄 ${m.files.map(esc).join(", ")}</div>`:""}</div>`).join("")}</div></div>`:""}
      ${isEdit?`<div><label>Activity</label><div id="mactivity" class="feed" style="max-height:150px"></div></div>`:""}
    </div>
    <div class="row" style="justify-content:space-between;margin-top:18px">
      <div>${isEdit?`<button id="mfire" class="ghost" style="color:var(--danger)">Fire</button>`:""}</div>
      <div class="row" style="gap:10px"><button id="mcancel">Cancel</button><button class="primary" id="msave">${isEdit?"Save":"Hire"}</button></div>
    </div>
  </div>`;
  document.body.appendChild(wrap);

  const setForm=(role,persona,traits,hr)=>{ $("#mrole",wrap).value=role; $("#mpersona",wrap).value=persona; chosen=new Set(traits); if(hr!==undefined){isHR=hr;$("#mhr",wrap).checked=hr;} paintT(); };

  const tpl=$("#mtpl",wrap);
  Object.keys(TEMPLATES).forEach(r=>{ const chip=el("span","chip",r);
    chip.onclick=()=>{ setForm(r,TEMPLATES[r].persona,TEMPLATES[r].traits, r==="HR Manager"?true:undefined); scheduleAutoBio(); };
    tpl.appendChild(chip); });

  const ask=$("#mask",wrap);
  if(ask) ask.onclick=async()=>{ ask.disabled=true; ask.textContent="thinking…";
    try{ const c=await api("POST","/api/hr/suggest",{brief:$("#mrole",wrap).value.trim()});
      if(c&&c.name){ setForm(c.role||"",c.persona||"",c.traits||[],false); $("#mname",wrap).value=c.name; scheduleAutoBio();
        $("#hrb",wrap).innerHTML=`<b>${esc(c.by)}</b> suggests <b>${esc(c.name)}</b> — ${esc(c.pitch||"")} <span class="dim">(edit anything, then Hire)</span>`; }
      else { ask.textContent="try again"; ask.disabled=false; }
    }catch{ ask.textContent="try again"; ask.disabled=false; } };

  const tbox=$("#mtraits",wrap);
  function paintT(fromUser){ tbox.innerHTML="";
    [...chosen].forEach(tr=>{ const c=el("span","chip on",esc(tr)+" ✕"); c.title="remove"; c.onclick=()=>{chosen.delete(tr);paintT(true);}; tbox.appendChild(c); });
    TRAIT_POOL.filter(t=>!chosen.has(t)).forEach(tr=>{ const c=el("span","chip",tr); c.onclick=()=>{chosen.add(tr);paintT(true);}; tbox.appendChild(c); });
    if(fromUser) scheduleAutoBio(); }
  paintT(false);
  if(opts.hrMode==="bootstrap"){ const t=TEMPLATES["HR Manager"]; setForm("HR Manager",t.persona,t.traits,true); $("#mdept",wrap).value="People"; }
  const add=$("#mtraitadd",wrap);
  add.onkeydown=(e)=>{ if(e.key==="Enter"){ e.preventDefault(); const v=add.value.trim(); if(v){chosen.add(v);add.value="";paintT(true);} } };

  // ---- Advanced: full markdown profile, generated from the form fields via the LLM ----
  const advToggle=$("#madvtoggle",wrap), advPanel=$("#madv",wrap), bioBox=$("#mbio",wrap), bioStatus=$("#mbiostatus",wrap), bioGenBtn=$("#mbiogen",wrap);
  let advOpen=false, bioTimer=null;
  advToggle.onclick=()=>{ advOpen=!advOpen; advPanel.classList.toggle("hidden",!advOpen); advToggle.textContent=(advOpen?"Advanced ▴":"Advanced ▾")+" full profile (markdown, sent to the LLM)"; };
  const BIO_HELP_TEXT=bioStatus.textContent;
  async function regenBio(){
    bioGenBtn.disabled=true; bioStatus.textContent="Regenerating with AI…";
    try{
      const r=await api("POST","/api/bio/generate",{ name:$("#mname",wrap).value.trim(), role:$("#mrole",wrap).value.trim(),
        persona:$("#mpersona",wrap).value.trim(), traits:[...chosen], department:$("#mdept",wrap).value.trim(),
        focus: isEdit?(agent.focus||""):"" });
      if(r&&r.bio){ bioBox.value=r.bio; bioStatus.textContent="Updated just now."; }
      else { bioStatus.textContent="Couldn't generate a profile — try again."; }
    }catch{ bioStatus.textContent="Couldn't generate a profile — try again."; }
    finally{ bioGenBtn.disabled=false; setTimeout(()=>{ if(bioStatus.textContent==="Updated just now.") bioStatus.textContent=BIO_HELP_TEXT; },2600); }
  }
  function scheduleAutoBio(){ clearTimeout(bioTimer); bioStatus.textContent="Traits changed — regenerating shortly…"; bioTimer=setTimeout(regenBio,900); }
  bioGenBtn.onclick=()=>{ clearTimeout(bioTimer); regenBio(); };

  if(isEdit){
    const items=(ORG.activity||[]).filter(a=>a.agent===agent.name);
    $("#mactivity",wrap).innerHTML=items.length
      ? items.map(a=>{ const n=(a.criteria||[]).length, met=(a.criteria||[]).filter(c=>c.status==="met").length;
          const vb=a.verdict&&n?` <span class="verdictbadge ${esc(a.verdict)}">${a.verdict==="passed"?`✓ ${met}/${n}`:a.verdict==="shortfall"?`⚠ ${met}/${n}`:"unverified"}</span>`:"";
          return `<div class="ev"><div class="who">${new Date(a.at).toLocaleString()}${a.delegated?" · delegated "+a.delegated:""}${vb}</div><div>${esc(a.objective)} <span class="dim">· ${a.tokens} tok</span></div></div>`; }).join("")
      : `<div class="dim">No activity yet.</div>`;
    paintStatus();
    $("#mfire",wrap).onclick=async()=>{ if(confirm(`Let ${agent.name} go?`)){ await api("DELETE","/api/agents/"+agent.id); wrap.remove(); ORG=await api("GET","/api/org"); render(); } };
  }
  $("#mcancel",wrap).onclick=()=>wrap.remove();
  wrap.onclick=(e)=>{ if(e.target===wrap) wrap.remove(); };
  $("#msave",wrap).onclick=async()=>{
    const role=$("#mrole",wrap).value.trim()||"Generalist";
    const budVal=$("#mbudget",wrap).value.trim();
    const payload={ name:$("#mname",wrap).value.trim()||role, role, persona:$("#mpersona",wrap).value.trim(), traits:[...chosen], managerId:$("#mmgr",wrap).value, hr:$("#mhr",wrap).checked, department:$("#mdept",wrap).value.trim(), bio:$("#mbio",wrap).value.trim() };
    payload.budgetUsd = budVal==="" ? 0 : Number(budVal);
    { const mmt=$("#mmodeltier",wrap); if(mmt) payload.modelTier = mmt.value; }
    payload.allow = [...wrap.querySelectorAll("#mallow input:checked")].map(c=>c.value);
    { const mt=$("#mtier",wrap); if(mt) payload.tier = mt.value; }
    if(isEdit){ const ml=$("#mlessons",wrap); if(ml) payload.lessons = ml.value.split("\n").map(s=>s.trim()).filter(Boolean); }
    if(isEdit) await api("PATCH","/api/agents/"+agent.id,payload); else await api("POST","/api/agents",payload);
    wrap.remove(); ORG=await api("GET","/api/org"); render();
  };
  $("#mrole",wrap).focus();
}

boot();
setInterval(pollGate(refreshHealth), 7000);
setInterval(pollGate(refreshInbox), 12000);
setInterval(pollGate(pollStatus), 2000);
</script>
</body>
