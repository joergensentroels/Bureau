<!doctype html>
<html lang="en" data-theme="ops">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bureau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  /* Themes live entirely in these tokens — adding "Pixel Tycoon" later is a new [data-theme] block, not a rewrite. */
  :root[data-theme="ops"]{
    --bg:#0e1116; --panel:#141821; --panel-2:#10141b; --line:#202b36; --line-2:#2c3a48;
    --ink:#e4edf2; --ink-2:#8397a5; --ink-3:#566574;
    --accent:#59d9b3; --accent-2:#5aa9f0; --danger:#e0705f; --warn:#f0b15a; --ok:#59d9b3;
    --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,monospace;
    --font-display:ui-monospace,"Cascadia Mono",Consolas,monospace;
    --radius:10px;
    --iso-a:#1a212b; --iso-b:#151b23; --iso-meet:#16324a; --iso-line:#0b0e13;
    --iso-table:#2c4a44; --iso-tableside:#1c322e; --iso-desk:#2a3947; --iso-deskside:#1a2530;
  }
  :root[data-theme="pixel"]{
    --bg:#20344a; --panel:#2b4763; --panel-2:#182a3e; --line:#0b131f; --line-2:#4a6b86;
    --ink:#f6edd6; --ink-2:#a9c0b0; --ink-3:#7089a0;
    --accent:#4ecca3; --accent-2:#f2b23d; --danger:#e2564d; --warn:#f2b23d; --ok:#7bd88f;
    --mono:"VT323","Cascadia Mono",Consolas,monospace;
    --font-display:"Press Start 2P","VT323",monospace;
    --radius:2px;
    --iso-a:#2a4058; --iso-b:#24384f; --iso-meet:#3a5f6b; --iso-line:#0b131f;
    --iso-table:#8a6a3a; --iso-tableside:#5c451f; --iso-desk:#4a6b86; --iso-deskside:#2f4a5f;
  }
  [data-theme="pixel"] body{font-size:18px;letter-spacing:.01em;image-rendering:pixelated}
  [data-theme="pixel"] .brand{font-family:var(--font-display);font-size:12px;letter-spacing:.04em}
  [data-theme="pixel"] h1,[data-theme="pixel"] .onb h1{font-family:var(--font-display);font-size:15px;line-height:1.5}
  [data-theme="pixel"] h2{font-family:var(--font-display);font-size:10px}
  [data-theme="pixel"] .nm,[data-theme="pixel"] .brand b{font-family:var(--font-display);font-size:10px}
  [data-theme="pixel"] .card,[data-theme="pixel"] .agent,[data-theme="pixel"] .treenode,[data-theme="pixel"] .modal,[data-theme="pixel"] .hire-tile{border-radius:3px;border-width:2px}
  [data-theme="pixel"] button,[data-theme="pixel"] input,[data-theme="pixel"] textarea,[data-theme="pixel"] select{border-radius:3px;border-width:2px}
  [data-theme="pixel"] .av{image-rendering:pixelated;border-radius:2px}
  [data-theme="pixel"] .k,[data-theme="pixel"] .stat .v,[data-theme="pixel"] #budget{font-family:var(--font-display);font-size:9px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--accent-2);text-decoration:none} a:hover{text-decoration:underline}
  button{font-family:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line-2);border-radius:8px;padding:8px 14px;cursor:pointer;transition:.12s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);color:#062b22;border-color:var(--accent);font-weight:600}
  button.primary:hover{color:#062b22;filter:brightness(1.08)}
  button.ghost{border-color:transparent;color:var(--ink-3);padding:4px 8px}
  button.ghost:hover{color:var(--danger);border-color:transparent}
  button:disabled{opacity:.4;cursor:not-allowed}
  input,textarea,select{font-family:inherit;font-size:13px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;width:100%}
  textarea{resize:vertical;min-height:70px;line-height:1.5}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(89,217,179,.12)}
  label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
  .row{display:flex;gap:10px;align-items:center}
  .muted{color:var(--ink-2)} .dim{color:var(--ink-3)}
  .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid var(--line-2);color:var(--ink-2)}

  header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel-2)}
  .brand{font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:15px}
  .brand b{color:var(--accent)}
  header .spacer{flex:1}
  .wsswitch{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font-size:13px;cursor:pointer}
  .wsswitch:hover{border-color:var(--accent-2)}
  .stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
  .stat .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .stat .v{font-size:14px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--ink-3)}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(89,217,179,.18)}
  .dot.bad{background:var(--danger);box-shadow:0 0 0 3px rgba(224,112,95,.18)}
  .latchlink{text-decoration:none;color:inherit;cursor:pointer}
  .latchlink:hover .k{color:var(--accent)}
  .nbadge{display:none;margin-left:6px;background:var(--warn);color:#3a2a00;font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px;vertical-align:1px}
  .nbadge.show{display:inline-block}
  .inboxbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink-2);font-size:12px;font-weight:600;padding:6px 11px;border-radius:9px;cursor:pointer;position:relative}
  .inboxbtn:hover{border-color:var(--accent);color:var(--accent)}
  .audfilters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .audfilters button{font-size:11px;padding:3px 10px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink-2);cursor:pointer}
  .audfilters button.on{border-color:var(--accent);color:var(--accent)}
  #audlist{max-height:62vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
  .decbadge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:1px 7px;border-radius:8px;white-space:nowrap;align-self:center}
  .decbadge.auto{background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line-2)}
  .decbadge.you{background:rgba(89,217,179,.14);color:var(--accent-2);border:1px solid rgba(89,217,179,.35)}
  .decbadge.denied{background:rgba(224,112,95,.16);color:var(--danger);border:1px solid rgba(224,112,95,.4)}
  .allowgrid{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
  .allowchk{display:inline-flex;align-items:center;gap:5px;font-size:12px;text-transform:none;letter-spacing:0;color:var(--ink-2);cursor:pointer}
  .allowchk input{width:auto;margin:0}
  .planedit{width:100%;min-height:76px;resize:vertical;background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;color:var(--ink);font-family:inherit;font-size:12px;padding:8px 10px;line-height:1.55}
  .stbadge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:7px;white-space:nowrap;align-self:center}
  .stbadge.draft{background:var(--panel-2);color:var(--ink-3);border:1px solid var(--line-2)}
  .stbadge.qa{background:rgba(90,169,240,.16);color:#5aa9f0;border:1px solid rgba(90,169,240,.4)}
  .stbadge.approved{background:rgba(89,217,179,.16);color:var(--ok);border:1px solid rgba(89,217,179,.4)}
  .stbadge.delivered{background:rgba(89,217,179,.30);color:var(--ok);border:1px solid var(--ok)}
  .vrow{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--line-2);border-radius:7px;margin-bottom:5px;font-size:12px;cursor:pointer;color:var(--ink-2)}
  .vrow:hover{border-color:var(--accent-2);color:var(--ink)}
  .diffbox{max-height:48vh;overflow:auto;border:1px solid var(--line-2);border-radius:8px;padding:8px;background:var(--panel-2);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5}
  .dl{white-space:pre-wrap;padding:0 4px}
  .dl.add{background:rgba(89,217,179,.14);color:var(--ok)}
  .dl.del{background:rgba(224,112,95,.14);color:var(--danger)}
  .goalcard{background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;margin-bottom:8px}
  .gtitle{font-size:13px;color:var(--ink);font-weight:600}
  .gbar{height:6px;background:var(--line-2);border-radius:4px;overflow:hidden;margin-top:8px}
  .gbarfill{height:100%;background:var(--accent-2);border-radius:4px;transition:width .3s}
  .krlist{display:flex;flex-direction:column;gap:3px}
  .krchk{display:flex;align-items:flex-start;gap:6px;font-size:12px;color:var(--ink-2);cursor:pointer;text-transform:none;letter-spacing:0}
  .krchk input{width:auto;margin:2px 0 0;flex:none}
  .grow{display:flex;align-items:center;gap:3px;margin-top:7px}
  .rdotv{width:9px;height:9px;border-radius:2px;display:inline-block;background:var(--idle)}
  .rdotv.passed{background:var(--ok)} .rdotv.shortfall{background:var(--warn)} .rdotv.rejected{background:var(--danger)} .rdotv.unverified{background:var(--ink-3)}
  .revcard{background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .revstats{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;font-size:11px;color:var(--ink-2)}
  .rec{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap;align-self:flex-start}
  .rec.good{background:rgba(89,217,179,.14);color:var(--ok);border-color:rgba(89,217,179,.4)}
  .rec.warn{background:rgba(240,177,90,.16);color:var(--warn);border-color:rgba(240,177,90,.4)}
  #revlist{max-height:64vh;overflow:auto}
  .inboxbtn .ibell{font-size:13px;line-height:1;filter:grayscale(.2)}
  .inboxbtn.hot{border-color:var(--warn);color:var(--ink)}
  .inboxbtn.hot .ibell{animation:ibell .9s ease 1}
  @keyframes ibell{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
  .ibsec{margin-top:18px}
  .ibsec:first-of-type{margin-top:6px}
  .ibsec h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px;display:flex;align-items:center;gap:8px}
  .ibsec h3 .c{background:var(--panel-2);border:1px solid var(--line-2);border-radius:9px;padding:0 7px;font-size:11px}
  .ibrow{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:9px;margin-bottom:6px}
  .ibrow.click{cursor:pointer}
  .ibrow.click:hover{border-color:var(--accent-2)}
  .ibrow .ibmain{flex:1;min-width:0}
  .ibrow .ibt{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ibrow .ibd{font-size:11px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .apcmd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;margin:0;white-space:pre-wrap;word-break:break-word;max-height:120px;overflow:auto;color:var(--ink)}
  .ap-approve.armed{background:var(--danger);border-color:var(--danger);color:#fff}
  .risk{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:8px;white-space:nowrap}
  .risk.high{background:rgba(224,112,95,.16);color:var(--danger);border:1px solid rgba(224,112,95,.4)}
  .risk.medium{background:rgba(240,177,90,.16);color:var(--warn);border:1px solid rgba(240,177,90,.4)}
  .risk.low{background:rgba(89,217,179,.14);color:var(--accent-2);border:1px solid rgba(89,217,179,.35)}
  .ibempty{text-align:center;padding:26px 10px;color:var(--ink-2)}
  .ibempty .big{font-size:30px;margin-bottom:6px}

  main{max-width:1100px;margin:0 auto;padding:22px;display:grid;grid-template-columns:1.15fr 1fr;gap:22px}
  @media (max-width:860px){main{grid-template-columns:1fr}}
  main.officemode{grid-template-columns:1fr}
  main>section{min-width:0}   /* let wide content (office floor, hierarchy chart) scroll INSIDE its box instead of blowing out the grid column and overflowing the page */
  h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin:0 0 14px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .agent{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;position:relative;transition:.12s}
  .agent:hover{border-color:var(--line-2)}
  .agent.ceo{border-color:var(--accent-2);background:linear-gradient(0deg,var(--panel),var(--panel))}
  .agent .av{display:block;border-radius:10px;margin-bottom:10px}
  .agent .nm{font-weight:600}
  .agent .rl{font-size:12px;color:var(--accent);margin-top:1px}
  .agent .traits{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .agent .traits span{font-size:10px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:12px;padding:1px 7px}
  .agent .fire{position:absolute;top:8px;right:8px;opacity:0;font-size:11px}
  .agent:hover .fire{opacity:1}
  .statusline{position:absolute;top:10px;right:12px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:5px}
  .statusline:empty{display:none}
  .statusline .pdot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
  .statusline.st-work{color:var(--accent)} .statusline.st-work .pdot{background:var(--accent);animation:pulse 1.2s infinite}
  .statusline.st-wait{color:var(--warn)} .statusline.st-wait .pdot{background:var(--warn);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .agent .edithint{position:absolute;bottom:8px;right:10px;font-size:10px;color:var(--ink-3);opacity:0;transition:.12s}
  .agent:hover .edithint{opacity:1}
  .hire-tile{display:flex;align-items:center;justify-content:center;min-height:120px;border:1px dashed var(--line-2);border-radius:var(--radius);color:var(--ink-3);cursor:pointer;transition:.12s}
  .hire-tile:hover{border-color:var(--accent);color:var(--accent)}

  .orghead{display:flex;align-items:center;gap:10px;margin:0 0 14px}
  .toggle{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;margin-left:auto}
  .toggle button{border:0;border-radius:0;padding:5px 12px;font-size:12px;color:var(--ink-2);background:transparent}
  .toggle button.on{background:var(--accent);color:#062b22;font-weight:600}
  .toggle button:hover:not(.on){color:var(--accent);background:transparent}
  .miniadd{font-size:12px;padding:5px 12px}

  .chart{overflow:auto;padding:6px 0 10px;text-align:center;cursor:grab;touch-action:none}
  .chart.panning{cursor:grabbing;user-select:none}
  .chart.panning .treenode{pointer-events:none}
  .chart ul{padding-top:22px;position:relative;margin:0;list-style:none;white-space:nowrap;text-align:center}
  .chart li{display:inline-block;vertical-align:top;position:relative;padding:22px 12px 0;text-align:center;list-style:none}
  .chart li::before,.chart li::after{content:"";position:absolute;top:0;right:50%;border-top:1px solid var(--line-2);width:50%;height:22px}
  .chart li::after{right:auto;left:50%;border-left:1px solid var(--line-2)}
  .chart li:only-child::before,.chart li:only-child::after{display:none}
  .chart li:only-child{padding-top:0}
  .chart li:first-child::before,.chart li:last-child::after{border:0 none}
  .chart li:last-child::before{border-right:1px solid var(--line-2);border-radius:0 6px 0 0}
  .chart li:first-child::after{border-radius:6px 0 0 0}
  .chart ul ul::before{content:"";position:absolute;top:0;left:50%;border-left:1px solid var(--line-2);width:0;height:22px}
  .chart > ul{padding-top:0}
  .treenode{position:relative;display:inline-block;width:150px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:.12s;vertical-align:top;white-space:normal}
  .treenode:hover{border-color:var(--line-2)}
  .treenode.ceo{border-color:var(--accent-2);cursor:default}
  .treenode .av{margin-bottom:8px}
  .treenode .nm{font-weight:600;font-size:14px}
  .treenode .rl{font-size:11px;color:var(--accent);margin-top:1px;line-height:1.3}
  .treenode.ceo .rl{color:var(--accent-2)}

  .floorwrap{cursor:grab;position:relative;overflow:auto;max-width:100%;max-height:700px;border:1px solid var(--line);border-radius:14px;
    background-color:#4f7f3e;
    background-image:linear-gradient(45deg,rgba(0,0,0,.06) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.06) 75%),linear-gradient(45deg,rgba(255,255,255,.05) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.05) 75%);
    background-size:34px 34px;background-position:0 0,17px 17px}
  .floorwrap.grabbing{cursor:grabbing}
  .floorwrap.grabbing *{cursor:grabbing !important}
  .hqsign{position:sticky;top:10px;left:10px;z-index:20;display:inline-block;margin:10px;background:rgba(20,24,17,.82);color:#f4efe2;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;backdrop-filter:blur(2px);cursor:pointer}
  .hqsign:hover{border-color:var(--accent)}
  .floorplan{position:relative;width:1320px;height:920px}
  .trees{position:absolute;inset:0;z-index:1}
  .tree{position:absolute}
  .corridors{position:absolute;inset:0;z-index:2;pointer-events:none}
  .corridors path{fill:none;stroke-linejoin:round;stroke-linecap:round}
  .corridors .cway{stroke:#c9bc9a;stroke-width:22;opacity:.92}
  .corridors .cline{stroke:#a89a72;stroke-width:2;stroke-dasharray:6 7;opacity:.7}
  .cprops{position:absolute;inset:0;z-index:3;pointer-events:none}
  .cprop{position:absolute}
  .isoroom{position:absolute;z-index:3}
  .roomsign{cursor:grab;user-select:none;touch-action:none;display:inline-block;background:#23272f;color:#eae4d3;border:1px solid #0e1116;border-radius:4px;padding:3px 9px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:1px;box-shadow:0 2px 5px rgba(0,0,0,.35)}
  .roomsign:active{cursor:grabbing}
  .roompaint{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-left:4px;cursor:pointer;background:linear-gradient(135deg,#2f6a5a 50%,#6a3560 50%);border:1px solid #0e1116}
  .roompaint:hover{outline:1px solid #f2b23d}
  .isoroom.meetingroom .roomsign,.isoroom.leadroom .roomsign{color:#f2b23d}
  .roomscene{position:relative}
  .roomsvg{position:absolute;left:0;top:0;filter:drop-shadow(0 10px 7px rgba(0,0,0,.3))}
  .rchars{position:absolute;inset:0}
  .rchar{position:absolute;width:24px;cursor:grab;touch-action:none}
  .rchar.dragging{cursor:grabbing;opacity:.9;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
  .rchar.npc{cursor:pointer}
  .flyclone{position:fixed;z-index:1000;pointer-events:none;filter:drop-shadow(0 8px 8px rgba(0,0,0,.45))}
  .rchar.ceo{cursor:default}
  .rchar .body{display:block;margin:0 auto}
  .rchar .rcname{position:absolute;top:42px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9px;color:#f4efe2;text-shadow:0 1px 2px #000,0 0 2px #000}
  .rchar[data-node]:hover .body{filter:brightness(1.2)}
  .rchar:not(.st-work):not(.st-wait) .body{opacity:.82}
  .rchar .cbubble{position:absolute;top:-8px;left:50%;transform:translateX(-50%);display:none;z-index:6}
  .rchar.st-wait .cbubble{display:flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:9px;background:var(--warn);border:1px solid #0e1116}
  .rchar.st-wait .cbubble::after{content:"!";color:#3a2a00;font-weight:700;font-size:11px}

<body>
<header>

  <span class="tag" id="authWarn" style="display:none;cursor:pointer" title="Bureau is not accepting this browser's token, so live polling has paused. Click to enter the operator token.">⚠ not signed in — sign in</span>
  <span class="tag" id="remoteBadge" style="display:none" title="BUREAU_REMOTE is set: actions that always need a human (shell, api_call, email, repo creation, external MCP calls, over-ceiling purchases) cannot be approved from here. Decide those in Latch/Compass on the trusted host. Rejecting anything still works.">🔒 remote mode</span>

<div id="app"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const el = (t, c, h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const esc = (s) => String(s==null?"":s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));

let ORG = null, HEALTH = null;

function curTheme(){ return document.documentElement.getAttribute("data-theme")||"ops"; }
function avatar(seed, size){ return curTheme()==="pixel" ? pixelAvatar(seed,size) : opsAvatar(seed,size); }

// Little staff-portrait pixel sprite (head + shoulders), deterministic from seed. Theme Hospital vibe.
function pixelAvatar(seed, size){
  function h(s){let x=2166136261>>>0;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619);}return x>>>0;}
  function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  const r=mul(h("pix2"+seed)), P=(a)=>a[Math.floor(r()*a.length)];
  const skin=P(["#f2cfa4","#e0a878","#c98a5e","#9c6b45","#7a4e30"]);
  const hair=P(["#2b2b33","#5a3a22","#c0603a","#d9c26a","#8a8a94","#3a5a8c"]);
  const uni=P(["#4ecca3","#e2564d","#5aa9f0","#f2b23d","#b06fd0","#e8e8e8"]);
  const bg=P(["#182a3e","#26324a","#2e2440","#243a34"]);
  const dark="#1a1622";
  const N=12, C=100/N, G=Array.from({length:N},()=>Array(N).fill(bg));
  const set=(x,y,c)=>{ if(x<0||x>=N||y<0||y>=N)return; G[y][x]=c; G[y][N-1-x]=c; };
  for(let y=3;y<=8;y++)for(let x=3;x<=5;x++) set(x,y,skin);      // head
  set(3,3,bg); set(3,8,bg);                                     // round corners
  for(let x=3;x<=5;x++){ set(x,1,hair); set(x,2,hair); }        // hair top
  set(2,3,hair); set(2,4,hair); set(3,3,hair);                  // temples
  if(r()<0.5){ set(5,3,hair); } else { set(4,2,uni); }          // fringe or a cap flash
  set(4,5,dark);                                                // eyes
  set(4,7,"#a85c4a");                                           // mouth
  for(let y=9;y<N;y++)for(let x=1;x<=5;x++) set(x,y,uni);       // shoulders
  set(5,9,"#f6edd6"); set(4,9,skin);                            // collar + neck
  let s="";
  for(let y=0;y<N;y++)for(let x=0;x<N;x++) s+=`<rect x="${(x*C).toFixed(2)}" y="${(y*C).toFixed(2)}" width="${(C+0.5).toFixed(2)}" height="${(C+0.5).toFixed(2)}" fill="${G[y][x]}"/>`;
  return `<svg class="av avpx" width="${size}" height="${size}" viewBox="0 0 100 100" shape-rendering="crispEdges" aria-hidden="true">${s}</svg>`;
}

function opsAvatar(seed, size){
  function h(s){let x=2166136261>>>0;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619);}return x>>>0;}
  function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  const r=mul(h("ops"+seed));
  const acc=["#59d9b3","#5aa9f0","#f0b15a","#c58bf0","#e0705f"][Math.floor(r()*5)];
  let g='<rect width="100" height="100" rx="14" fill="#0b0e13"/><rect x="1" y="1" width="98" height="98" rx="13" fill="none" stroke="#22303b"/>';
  for(let y=0;y<5;y++)for(let x=0;x<3;x++){ if(r()>.5){const op=(0.5+r()*0.5).toFixed(2);
    g+='<rect x="'+(18+x*16)+'" y="'+(18+y*13)+'" width="12" height="9" rx="2" fill="'+acc+'" opacity="'+op+'"/>';
    g+='<rect x="'+(18+(4-x)*16)+'" y="'+(18+y*13)+'" width="12" height="9" rx="2" fill="'+acc+'" opacity="'+op+'"/>';}}
  return '<svg class="av" width="'+size+'" height="'+size+'" viewBox="0 0 100 100" aria-hidden="true">'+g+'</svg>';
}

const TEMPLATES = {
  "HR Manager":         { persona:"You run hiring for the company: you size up gaps on the team and bring in the right people.", traits:["personable","organized","perceptive"] },
  "Research Assistant": { persona:"You gather and verify information carefully before acting.", traits:["meticulous","thorough"] },
  "Writer":             { persona:"You turn rough intent into clear, warm prose.", traits:["warm","clear"] },
  "Analyst":            { persona:"You interrogate numbers and claims and flag what doesn't add up.", traits:["skeptical","precise"] },
  "Ops Engineer":       { persona:"You take the smallest concrete step that makes real progress.", traits:["blunt","pragmatic"] },
  "Outreach":           { persona:"You draft and manage contact with people on the CEO's behalf.", traits:["personable","persistent"] },
  "Generalist":         { persona:"You handle whatever the CEO needs, sensibly.", traits:["adaptable"] },
};
const TRAIT_POOL = ["meticulous","blunt","creative","cautious","fast","thorough","skeptical","warm","persistent","analytical","personable","pragmatic"];

const curWs = () => localStorage.getItem("bureau_ws") || "default";
let WORKSPACES=[{id:"default",name:"Default"}];
function paintWsLabel(){ const w=WORKSPACES.find(x=>x.id===curWs()); const el=$("#wsName"); if(el) el.textContent=(w&&w.name)||"Default"; }
async function switchWs(id){
  if(id===curWs()) return;
  localStorage.setItem("bureau_ws", id);
  paintWsLabel();
  document.querySelector(".modalwrap")?.remove();
  await boot();                 // reload the whole org view for the new workspace
}
async function openWorkspaces(){
  let data; try{ data=await api("GET","/api/workspaces"); WORKSPACES=data.workspaces||WORKSPACES; }catch{}
  paintWsLabel();
  const wrap=el("div","modalwrap");
  const rows=()=>WORKSPACES.map(w=>`<div class="ibrow" style="align-items:center" data-wsid="${esc(w.id)}">
      <div class="ibmain" style="cursor:pointer" data-go="${esc(w.id)}"><div class="ibt">${esc(w.name)}${w.id===curWs()?' <span class="hrtag" style="background:var(--ok)">current</span>':''}</div><div class="ibd">${esc(w.id)}</div></div>
      <button data-rename="${esc(w.id)}" title="Rename" style="padding:2px 8px">✎</button>
      ${w.id==="default"?"":`<button data-del="${esc(w.id)}" title="Delete workspace + its data" style="padding:2px 8px">🗑</button>`}
    </div>`).join("");
  wrap.innerHTML=`<div class="modal" style="max-width:480px">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:6px"><h1 style="font-size:16px;margin:0;text-transform:none">🏢 Workspaces</h1><button id="wscl">Close</button></div>
    <div class="dim" style="font-size:12px;margin-bottom:10px">Each workspace is a separate company — its own agents, goals, policies, deliverables, and approvals. Switching reloads the view.</div>
    <div id="wslist">${rows()}</div>
    <div class="row" style="gap:7px;margin-top:12px"><input id="wsNew" type="text" placeholder="New workspace name…" style="flex:1"><button class="primary" id="wsAdd">Create</button></div></div>`;
  document.body.appendChild(wrap);
  wrap.onclick=e=>{ if(e.target===wrap) wrap.remove(); };
  wrap.querySelector("#wscl").onclick=()=>wrap.remove();
  const relist=()=>{ wrap.querySelector("#wslist").innerHTML=rows(); wire(); };
  function wire(){
    wrap.querySelectorAll("[data-go]").forEach(n=>n.onclick=()=>switchWs(n.dataset.go));
    wrap.querySelectorAll("[data-rename]").forEach(b=>b.onclick=async()=>{ const w=WORKSPACES.find(x=>x.id===b.dataset.rename); const name=prompt("Rename workspace:",w?.name||""); if(name&&name.trim()){ await api("PATCH","/api/workspaces/"+b.dataset.rename,{name:name.trim()}); WORKSPACES=(await api("GET","/api/workspaces")).workspaces; paintWsLabel(); relist(); } });
    wrap.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ const w=WORKSPACES.find(x=>x.id===b.dataset.del); if(!confirm(`Delete workspace "${w?.name}" and all its data (agents, deliverables, history)? This cannot be undone.`)) return; await api("DELETE","/api/workspaces/"+b.dataset.del); if(curWs()===b.dataset.del){ localStorage.setItem("bureau_ws","default"); } WORKSPACES=(await api("GET","/api/workspaces")).workspaces; if(curWs()===b.dataset.del){ return switchWs("default"); } paintWsLabel(); relist(); });
  }
  wire();
  wrap.querySelector("#wsAdd").onclick=async()=>{
    const name=wrap.querySelector("#wsNew").value.trim(); if(!name) return;
    const r=await api("POST","/api/workspaces",{name});
    if(r&&r.id){ WORKSPACES=(await api("GET","/api/workspaces")).workspaces; wrap.querySelector("#wsNew").value=""; relist(); }
    else alert("Could not create workspace: "+((r&&r.error)||"unknown"));
  };
}
// Operator token: the SAME token used for Latch. Held in localStorage; sent as a bearer header on
// every API call. On a 401 the UI prompts for it once and retries, so an unconfigured browser unlocks
// itself without a config file.
function opToken(){ return (localStorage.getItem("bureau_token")||"").trim(); }
function promptToken(){ const t=window.prompt("Bureau is locked. Enter your operator token (the same one you use for Latch):",""); if(t&&t.trim()){ localStorage.setItem("bureau_token",t.trim()); return true; } return false; }
function authHeaders(){ const t=opToken(); return t?{"authorization":"Bearer "+t}:{}; }
async function api(method, route, body){
  const go = () => fetch(route,{method,cache:"no-store",headers:{"content-type":"application/json","x-workspace":curWs(),...authHeaders()},body:body?JSON.stringify(body):undefined});
  let res = await go();
  if(res.status===401 && promptToken()) res = await go();   // unlock + retry once
  if(res.status===429) noteThrottled();                     // damper tripped — explain, don't die silently
  if(res.status===403) noteReadOnly(method,route);          // read-only token tried to write — say so plainly
  authStalled(res.status===401 || res.status===429);        // gate the background pollers (see below)
  const t = await res.text();                       // tolerate empty / non-JSON bodies instead of throwing
  try{ return t?JSON.parse(t):{}; }catch{ return {raw:t}; }
}
// The run feed is SSE read through fetch(), NOT EventSource: EventSource can't set headers, which would
// force the token into the query string, and a token in a URL is copied into the access log of every
// proxy/tunnel in the path. Same contract as before — onEvent per event, onEnd once — and .close()
// aborts. The server ending the stream (run finished) surfaces as onEnd, exactly like EventSource's
// reconnect-attempt error did.
function openRunStream(runId, onEvent, onEnd){
  const ctl=new AbortController(); let ended=false;
  const finish=()=>{ if(!ended){ ended=true; try{ onEnd(); }catch{} } };

// Background pollers must NOT keep hammering once auth is broken. A tab left open with a missing or
// stale token fires health+inbox+status on 7s/12s/2s timers forever — roughly 80 rejected requests a
// minute, which keeps the server's damper permanently tripped and buries its audit trail in noise.
// While stalled we let a single slow probe through instead, so recovery is still automatic the moment
// the token works again.

function authStalled(v){

// Wrap a poller so it goes quiet while stalled, apart from one probe per STALL_PROBE_MS (shared across
// all pollers, so it really is one request a minute, not one per poller).
function pollGate(fn){

}

// In-app approval seam: Approve requires a deliberate two-step confirm (first click arms the button,
// second click within 3s commits). Reject is single-click with an optional reason. Both call the
// server, which performs the same Latch PATCH Bureau already does for auto-approvals.
function wireApprovalRows(wrap){
  wrap.querySelectorAll(".approw").forEach(row=>{
    const id=row.dataset.aid;
    const reason=()=>row.querySelector(".ap-reason").value.trim();
    const decide=async(decision)=>{
      const r=await api("POST",`/api/approvals/${id}/decide`,{decision,note:reason()});
      if(r&&r.ok){ row.remove(); await refreshInbox();
        if(!wrap.querySelectorAll(".approw").length){ const h=[...wrap.querySelectorAll(".ibsec h3")].find(x=>/Needs your decision/.test(x.textContent)); if(h) h.closest(".ibsec").remove(); }
      } else if(r&&r.error==="remote_mode_hard_floor"){
        // Remote mode: this class of action can only be approved on the trusted host.
        alert("Remote mode is on, so Bureau won't approve this action"+(r.actionType?` (${r.actionType})`:"")+".\n\n"+(r.hint||"Decide it in Latch/Compass on the trusted host.")+"\n\nRejecting it from here still works.");
      } else if(r&&r.status){ alert(`This request was already ${r.status} (in Latch or by a rule). Refreshing.`); wrap.remove(); openInbox(); }
      else { alert("Couldn't record the decision: "+((r&&(r.hint||r.error))||"unknown error")+". Nothing was changed."); }
    };
    const rej=row.querySelector(".ap-reject");
    rej.onclick=()=>decide("denied");
    const ap=row.querySelector(".ap-approve"); let armed=false, t=null;
    ap.onclick=()=>{
      if(!armed){ armed=true; ap.classList.add("armed"); ap.textContent="Confirm approve"; t=setTimeout(()=>{ armed=false; ap.classList.remove("armed"); ap.textContent="Approve"; },3000); return; }
      clearTimeout(t); ap.disabled=true; ap.textContent="Approving…"; decide("approved");
    };
  });
}

// Amber on the paid budget at 75% used, red at 100%. Operator's number — named rather than inlined so
// it's one edit, and so the threshold isn't buried in a colour expression.
const PAID_WARN_AT = 0.75;
function fmtUsd(n){ return "$"+(Math.round((n||0)*100)/100).toLocaleString(); }
// Paid spend per run is often sub-cent — show up to 4 decimals for small amounts so it isn't "$0".
function fmtUsdFine(n){ n=Number(n)||0; if(n>0&&n<0.01) return "$"+n.toFixed(4); return fmtUsd(n); }
function updateEconomy(){
  const bal=$("#balance"); if(!bal) return;
  // spent / allocated, not allocated alone. Allocated on its own cannot tell you you are close to the
  // ceiling or past it — the header read "$1" while an agent had actually spent $1.14, which is the one
  // thing a budget display exists to surface. Both numbers come from the same per-agent records the
  // economy is enforced against, so this can't drift from the real gate.
  const agents=ORG.agents||[];
  const allocated=agents.reduce((s,a)=>s+(a.budgetUsd||0),0);        // real $ allocated to paid-model use
  const spentPaid=agents.reduce((s,a)=>s+(a.paidSpentUsd||0),0);     // real $ already spent on the paid API
  const paidOn=!!(HEALTH&&HEALTH.paid);
  const pctUsed = allocated>0 ? spentPaid/allocated : 0;
  bal.textContent = allocated>0 ? `${fmtUsdFine(spentPaid)} / ${fmtUsd(allocated)}` : "local only";
  // Over budget is the loud case; near the ceiling is the useful warning. "Allocated but no provider"
  // stays a warning too, but must not mask an overspend, so danger wins.
  bal.style.color = allocated>0 && pctUsed>=1 ? "var(--danger)"
    : allocated>0 && (pctUsed>=PAID_WARN_AT || !paidOn) ? "var(--warn)" : "";
  const exhausted=agents.filter(a=>(a.budgetUsd||0)>0 && (a.paidSpentUsd||0)>=(a.budgetUsd||0));
  const k=$("#balanceK"); if(k) k.textContent = !paidOn ? "Paid budget · no provider"
    : pctUsed>=1 ? "Paid budget · over" : `Paid budget · ${Math.round(pctUsed*100)}% used`;
  const rest = allocated>0
    ? `${fmtUsdFine(spentPaid)} spent of ${fmtUsd(allocated)} allocated across ${agents.filter(a=>(a.budgetUsd||0)>0).length} funded agent(s)`
      + ` · ${fmtUsdFine(Math.max(0,allocated-spentPaid))} left`
      + (exhausted.length ? `\nEXHAUSTED: ${exhausted.map(a=>`${a.name} (${fmtUsdFine(a.paidSpentUsd)}/${fmtUsd(a.budgetUsd)})`).join(", ")} — they fall back to the local model.` : "")
      // The ceiling is "budget plus one call", not a hard stop: canUsePaid() checks BEFORE a call, so the
      // call that crosses the line still completes. Say so, or a small overshoot looks like a leak.
      + `\nA budget stops FURTHER paid calls once crossed; the call that crosses it still completes, so a small overshoot is expected. guardrails.maxPaidUsdPerRun is the per-run brake.`
    : "No agent has a paid budget, so everything runs on the free local model.";
  bal.title = paidOn ? rest
    : `${rest}\n\nNO paid provider is configured in Latch, so every agent runs on the local model regardless of budget.`;
  // company purchasing funds
  const funds=ORG.budget?.funds||0, spent=ORG.budget?.spent||0, rem=Math.round((funds-spent)*100)/100;

  const fs=$("#fundsStat"); if(fs){ fs.title = funds>0?`Budget ${fmtUsd(funds)} · spent ${fmtUsd(spent)} · remaining ${fmtUsd(rem)} — click to change`:"Click to set the company purchasing budget"; fs.onclick=setCompanyBudget; }
}

// The signed-out screen. Says what is actually wrong, does not imply anything was lost, and gives you the
// button. Distinguishes a rejected token from a throttled address, because the fix differs: one is "paste
// it again", the other is "wait, or authenticate once from the host".
function renderSignedOut(app, res){
  // `.` not a space: the server's code is `too_many_auth_failures` and its hint is "too many rejected
  // credentials", so match both spellings rather than only the prose one.
  const throttled = /too.many|refusing new credential/i.test(String(res?.error||"")+" "+String(res?.hint||""));
  app.innerHTML="";
  const ov=el("div","overlay"); const box=el("div","onb");
  box.innerHTML=`
    <h1>Not signed in</h1>
    <p>Bureau can't read this company yet — ${throttled
      ? "this address has had too many rejected tokens, so new attempts are being refused for a few minutes."
      : "the browser is holding no valid operator token."}
    <b>Nothing has been lost:</b> your agents, deliverables and history are all on the host, unchanged. This
    screen is only what Bureau shows when it cannot read.</p>
    <p class="dim" style="font-size:12px">The operator token is the same one Latch uses — <code>operatorToken</code> in
    <code>openclaw-command-center/data/auth.json</code>. Paste it exactly: a trailing space or newline will fail.</p>

      <button class="primary" id="soSignIn">Sign in</button>

// Map-style hold-and-drag panning for the hierarchy chart: grab anywhere and drag to scroll it,
// with light inertia on release. A small movement threshold keeps plain clicks opening the agent
// modal; once a real drag starts, the click that follows pointerup is swallowed (same kill-click
// trick as the office view) so releasing over a node doesn't open it.
function wireChartPan(container){
  const chart=container.querySelector(".chart"); if(!chart) return;
  let down=false, moved=false, sx=0, sy=0, sl=0, st=0, vx=0, vy=0, lx=0, lt=0, glide=null;
  chart.addEventListener("pointerdown",(e)=>{
    if(e.button!==0) return;
    if(glide){ cancelAnimationFrame(glide); glide=null; }   // grabbing stops any ongoing glide
    down=true; moved=false; sx=lx=e.clientX; sy=e.clientY; sl=chart.scrollLeft; st=chart.scrollTop; vx=vy=0; lt=performance.now();
    try{ chart.setPointerCapture(e.pointerId); }catch{}
  });
  chart.addEventListener("pointermove",(e)=>{
    if(!down) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(!moved && Math.abs(dx)+Math.abs(dy)>5){ moved=true; chart.classList.add("panning"); }
    if(moved){
      chart.scrollLeft=sl-dx; chart.scrollTop=st-dy;
      const now=performance.now(), dt=Math.max(1,now-lt);           // track velocity for inertia
      vx=(e.clientX-lx)/dt; lx=e.clientX; lt=now;
    }
  });
  const end=()=>{
    if(!down) return;
    down=false; chart.classList.remove("panning");
    if(moved){
      const kill=(ev)=>{ ev.stopPropagation(); ev.preventDefault(); };
      chart.addEventListener("click",kill,true); setTimeout(()=>chart.removeEventListener("click",kill,true),0);
      // inertia: keep gliding in the release direction, decaying like a map fling (velocity clamped
      // so a fast flick coasts pleasantly instead of rocketing across the whole chart)
      let v=Math.max(-35, Math.min(35, vx*12));                      // px per frame-ish
      const step=()=>{ if(Math.abs(v)<0.5){ glide=null; return; } chart.scrollLeft-=v; v*=0.92; glide=requestAnimationFrame(step); };
      if(Math.abs(v)>1) glide=requestAnimationFrame(step);
    }
  };
  chart.addEventListener("pointerup",end); chart.addEventListener("pointercancel",end);
}

// Full-body upright pixel character (head, hair, torso/uniform, arms, legs), seeded.
// DEPT_UNIFORM ties each department to one uniform color (Theme Hospital-style: doctors in
// white, nurses in pink, handymen in green) so a room/meeting reads as one team at a glance.
const DEPT_UNIFORM={
  "Leadership":"#f2b23d", "Product & Technology":"#4ecca3", "Sales & Revenue":"#639922",
  "Marketing":"#b06fd0", "Customer Success & Support":"#5aa9f0", "Security":"#e2564d",
  "People":"#d4537e", "Operations":"#8a8a94",
};
function personSprite(seed, h, uniColor){
  function hs(s){let x=2166136261>>>0;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619);}return x>>>0;}
  function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  const r=mul(hs("body"+seed)), P=(a)=>a[Math.floor(r()*a.length)];
  const skin=P(["#f2cfa4","#e0a878","#c98a5e","#9c6b45","#7a4e30"]);
  const hair=P(["#2b2b33","#5a3a22","#c0603a","#d9c26a","#8a8a94","#3a5a8c"]);
  const uni=uniColor||P(["#4ecca3","#e2564d","#5aa9f0","#f2b23d","#b06fd0","#e8e8e8"]);
  const leg=P(["#2f3a4a","#3a2f26","#333333","#40384a"]);
  const W=16, Ht=28, G=Array.from({length:Ht},()=>Array(W).fill(null));
  const set=(x,y,c)=>{ if(x<0||x>=W||y<0||y>=Ht)return; G[y][x]=c; G[y][W-1-x]=c; };
  for(let y=2;y<=7;y++)for(let x=5;x<=7;x++)set(x,y,skin);         // head
  for(let x=5;x<=7;x++){ set(x,1,hair); set(x,2,hair); } set(5,3,hair); // hair
  set(6,5,"#1a1622");                                             // eyes (mirror)
  set(7,8,skin);                                                  // neck
  for(let y=9;y<=17;y++)for(let x=4;x<=7;x++)set(x,y,uni);         // torso
  for(let y=9;y<=15;y++)set(3,y,uni);                             // arms
  set(3,16,skin); set(3,17,skin);                                 // hands
  for(let y=18;y<=25;y++){ set(5,y,leg); set(6,y,leg); }          // legs
  set(5,26,"#20242c"); set(6,26,"#20242c");                       // feet
  let s=""; for(let y=0;y<Ht;y++)for(let x=0;x<W;x++) if(G[y][x]) s+=`<rect x="${x}" y="${y}" width="1.06" height="1.06" fill="${G[y][x]}"/>`;
  return `<svg class="body" width="${Math.round(h*W/Ht)}" height="${h}" viewBox="0 0 ${W} ${Ht}" shape-rendering="crispEdges">${s}</svg>`;
}

function loadStyle(){ try{ return JSON.parse(localStorage.getItem("bureau_style")||"{}"); }catch{ return {}; } }

// isometric room: raised back walls (L-shape), tiled iso floor, sprites standing inside.
// The office is composited from Kenney Furniture Kit sprites (CC0). Native floor tile = 151x110 px;
// we draw at ISO_S scale so rooms sit at a sane size. Iso stride = half-tile (75.5) x quarter (37.75).
const ISO_S=0.62;
const ISO_TW=75.5*ISO_S, ISO_TH=37.75*ISO_S, ISO_FW=151*ISO_S, ISO_FH=110*ISO_S, ISO_WLIFT=112*ISO_S, ISO_PAD=10;
const ASET="/assets/iso/";
// little people rendered from Kenney's CC0 character model (see _render.html). 61x152 native.
const PERSON_H=74, PERSON_W=61*74/152;
function skinFor(seed){ let h=0; const s=String(seed||"x"); for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0; return h%2?"person_f":"person_m"; }
function roomGrid(rm){
  const N=Math.max(1,rm.people.length);
  const iCols=Math.min(3,Math.max(2,Math.ceil(Math.sqrt(N)))), iRows=Math.ceil(N/iCols);
  const fc=iCols*2+1, fr=iRows*2+1;                 // stride-2 tiles so desks never overlap
  const oX=(fr-1)*ISO_TW+ISO_TW+ISO_PAD, oY=ISO_WLIFT+ISO_PAD;
  const W=oX+(fc-1)*ISO_TW+ISO_TW+ISO_PAD;
  const H=oY+(fc-1+fr-1)*ISO_TH+ISO_FH+ISO_PAD;
  return {iCols,iRows,fc,fr,oX,oY,W,H};
}
function isoRoomSize(rm){ const g=roomGrid(rm); return {w:g.W,h:g.H}; }
// A real office floor plan, not one long conga line: cluster the rooms into rows, run ONE shared
// horizontal hallway (a "spine") along the front of each row, drop a short stub from every room's
// door onto that spine, and join the rows with a vertical connecting hall. Returns the SVG path
// plus the spots where hallway props (plants/benches) should sit. Used by both the initial render
// and the live drag-redraw, so everything tracks when a room is moved.
function buildCorridors(items){
  if(items.length<2) return {d:"", props:[]};
  const meta=items.map((it,idx)=>({idx, cx:it.pos.x+it.size.w/2, cy:it.pos.y+it.size.h*0.62, top:it.pos.y}));
  // group into rows by vertical band
  const rows=[];
  meta.slice().sort((a,b)=>a.top-b.top || a.cx-b.cx).forEach(it=>{
    let row=rows.find(r=>Math.abs(r.top-it.top)<90);
    if(!row){ row={top:it.top, items:[]}; rows.push(row); }
    row.items.push(it);
  });
  rows.forEach(r=>{ r.items.sort((a,b)=>a.cx-b.cx); r.trunkY=Math.max(...r.items.map(i=>i.cy))+20;
    r.x0=Math.min(...r.items.map(i=>i.cx)); r.x1=Math.max(...r.items.map(i=>i.cx)); });
  let d="", props=[], pk=0;
  rows.forEach(row=>{
    if(row.items.length>1) d+=`M${row.x0.toFixed(1)},${row.trunkY.toFixed(1)} L${row.x1.toFixed(1)},${row.trunkY.toFixed(1)} `; // shared spine
    row.items.forEach(it=>{ d+=`M${it.cx.toFixed(1)},${it.cy.toFixed(1)} L${it.cx.toFixed(1)},${row.trunkY.toFixed(1)} `; }); // door stub
    for(let i=1;i<row.items.length;i++){ props.push({x:(row.items[i-1].cx+row.items[i].cx)/2, y:row.trunkY, kind:pk++%2}); }
  });
  // connecting hall between successive rows, placed where their spines overlap in x
  for(let i=1;i<rows.length;i++){
    const u=rows[i-1], l=rows[i];
    const lo=Math.max(u.x0,l.x0), hi=Math.min(u.x1,l.x1);
    const linkX=lo<=hi?(lo+hi)/2:Math.min(u.x0,l.x0)+30;
    d+=`M${linkX.toFixed(1)},${u.trunkY.toFixed(1)} L${linkX.toFixed(1)},${l.trunkY.toFixed(1)} `;
  }
  return {d, props};
}
function isoRoom(rm,pos){
  const ppl=rm.people;
  const {iCols,fc,fr,oX,oY,W,H}=roomGrid(rm);
  const ctr=(c,r)=>({x:oX+(c-r)*ISO_TW, y:oY+(c+r)*ISO_TH});
  const spr=(src,x,y,w)=>`<img class="ds" src="${ASET}${src}.png" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;width:${w.toFixed(1)}px">`;
  // floor: one tiled diamond per cell, painted back-to-front so fronts overlap correctly
  const floorItems=[];
  for(let r=0;r<fr;r++)for(let c=0;c<fc;c++){ const p=ctr(c,r); floorItems.push({y:p.y, h:spr("floorFull_SE",p.x-ISO_TW,p.y,ISO_FW)}); }
  floorItems.sort((a,b)=>a.y-b.y);
  let scene=floorItems.map(f=>f.h).join("");
  // back walls: left edge (c=0) uses wall_NE ("/"); right edge (r=0) uses wall_NW ("\"). Windows sprinkled,
  // a doorway near the right end. Kenney wall sprite is 80x153 native.
  const wImgW=80*ISO_S, wLift=ISO_WLIFT;
  const wallItems=[];
  for(let r=0;r<fr;r++){ const p=ctr(0,r); const win=(fr>=4 && (r===1||r===fr-2)); wallItems.push({y:p.y, h:spr(win?"wallWindow_NE":"wall_NE",p.x-ISO_TW,p.y-wLift,wImgW)}); }
  for(let c=0;c<fc;c++){ const p=ctr(c,0); const door=(c===fc-2); const win=(fc>=4 && c===1); wallItems.push({y:p.y, h:spr(door?"wallDoorway_NW":win?"wallWindow_NW":"wall_NW",p.x-4*ISO_S,p.y-wLift,wImgW)}); }
  wallItems.sort((a,b)=>a.y-b.y);
  scene+=wallItems.map(w=>w.h).join("");
  // furniture + decor, collected with a sort key (tile screen-y) so nearer items overlap farther ones
  const items=[];
  const at=(c,r,src,dx,dy,w,bias)=>{ const p=ctr(c,r); items.push({y:p.y+(bias||0), h:spr(src,p.x-ISO_TW+dx*ISO_S,p.y+dy*ISO_S,w*ISO_S)}); };
  const shadow=(c,r)=>{ const p=ctr(c,r); items.push({y:p.y-2, h:`<div class="dshadow" style="left:${(p.x-22*ISO_S).toFixed(1)}px;top:${(p.y-4*ISO_S).toFixed(1)}px;width:${(44*ISO_S).toFixed(1)}px;height:${(20*ISO_S).toFixed(1)}px"></div>`}); };
  const deskCells=ppl.map((p,i)=>({p,c:1+(i%iCols)*2,r:1+Math.floor(i/iCols)*2}));
  deskCells.forEach(({p,c,r})=>{
    at(c,r,"rugRound_SE",26,6,99,-6);
    shadow(c,r);
    at(c,r,"desk_SE",33,-30,85);
    at(c,r,"chairDesk_SE",55,4,44,2);
    at(c,r,"computerScreen_SE",58,-34,35,3);
    // the agent, standing at the desk (a bit to the left so their monitor stays visible)
    const cc=ctr(c,r), fx=cc.x-14, fy=cc.y+14, sk=skinFor(p.isCeo?"ceo":(p.a&&p.a.seed));
    items.push({y:cc.y+30, h:`<img class="ds person" src="${ASET}${sk}.png" style="left:${(fx-PERSON_W/2).toFixed(1)}px;top:${(fy-PERSON_H).toFixed(1)}px;width:${PERSON_W.toFixed(1)}px">`});
  });
  // back-corner plant, a trashcan near the entrance, and a department bookcase
  at(0,fr-1,"pottedPlant_SE",42,-4,24);
  at(fc-1,0,"trashcan_SE",42,-2,18);
  if(!rm.reception && !rm.breakroom && rm.key!=="__meeting") at(0,fr-2,"bookcaseClosed_SE",30,-30,46);
  // reception: a welcome counter + stool
  const personAt=(c,r,seed,ox,oy)=>{ const cc=ctr(c,r), fx=cc.x+(ox||0), fy=cc.y+(oy||0), sk=skinFor(seed);
    items.push({y:cc.y+30, h:`<img class="ds person" src="${ASET}${sk}.png" style="left:${(fx-PERSON_W/2).toFixed(1)}px;top:${(fy-PERSON_H).toFixed(1)}px;width:${PERSON_W.toFixed(1)}px">`}); };
  if(rm.reception){ const m=Math.floor(fc/2), mr=Math.floor(fr/2);
    at(m,mr,"kitchenBar_SE",14,-22,104);
    at(m,mr-1,"stoolBar_SE",52,-6,26,1);
    personAt(m,mr,"front-desk",-2,-10);
  }
  // staff room: sofa, coffee table, TV, coffee machine, plant
  if(rm.breakroom){ const mc=Math.floor(fc/2), mr=Math.floor(fr/2);
    at(mc-1,mr,"loungeSofa_SE",20,-18,94);
    at(mc,mr,"tableCoffee_SE",34,4,58,3);
    at(mc+1,mr-1,"televisionModern_SE",28,-30,62);
    at(mc+1,mr,"kitchenCoffeeMachine_SE",46,-14,32,4);
    personAt(mc-1,mr,"break-time",-18,10);
  }
  items.sort((a,b)=>a.y-b.y);
  scene+=items.map(it=>it.h).join("");
  // ---- overlay: nameplates + monitor status lights (crisp, unscaled divs at scene coords) ----
  const over=[];
  deskCells.forEach(({p,c,r})=>{
    const cc=ctr(c,r), nx=cc.x-14, ny=cc.y-66;
    if(p.isCeo){
      over.push(`<div class="rchar deskplate ceo" style="left:${nx.toFixed(1)}px;top:${ny.toFixed(1)}px"><span class="np" style="border-color:${DEPT_UNIFORM["Leadership"]}">You</span></div>`);
    } else {
      const uc=DEPT_UNIFORM[deptOf(p.a)]||"#5aa9f0";
      over.push(`<div class="rchar deskplate" data-node="${p.a.id}" style="left:${nx.toFixed(1)}px;top:${ny.toFixed(1)}px"><span class="np" style="border-color:${uc}">${esc(p.a.name)}${p.a.hr?' ·HR':''}</span></div>`);
      over.push(`<div class="deskscreen" data-node="${p.a.id}" style="left:${(cc.x-5).toFixed(1)}px;top:${(cc.y-30*ISO_S).toFixed(1)}px"></div>`);
    }
  });
  if(rm.reception){ const cc=ctr(Math.floor(fc/2),Math.floor(fr/2));
    over.push(`<div class="rchar npc deskplate" data-reception-npc="1" title="Talk to HR" style="left:${cc.x.toFixed(1)}px;top:${(cc.y-42*ISO_S).toFixed(1)}px"><span class="np" style="border-color:#f2b23d">Reception</span></div>`); }
  return `<div class="isoroom ${rm.cls}" data-dept="${esc(rm.key)}" style="left:${pos.x}px;top:${pos.y}px;width:${W.toFixed(0)}px">
    <div class="roomsign">${esc(rm.label)} <span class="dim">· ${ppl.length}</span> <span class="roompaint" title="Change floor tint"></span></div>
    <div class="roomscene" style="width:${W.toFixed(0)}px;height:${H.toFixed(0)}px"><div class="isoscene">${scene}</div><div class="rchars">${over.join("")}</div></div></div>`;
}
function officeHTML(){
  const meeting=new Set((STATUS&&STATUS.meeting)||[]);
  const active=meeting.size>0;
  const inMeeting=ORG.agents.filter(a=>meeting.has(a.id));
  const groups={};
  ORG.agents.forEach(a=>{ if(meeting.has(a.id))return; (groups[deptOf(a)]=groups[deptOf(a)]||[]).push(a); });
  const depts=Object.keys(groups).sort((x,y)=>{const ix=DEPT_ORDER.indexOf(x),iy=DEPT_ORDER.indexOf(y);return (ix<0?99:ix)-(iy<0?99:iy)||x.localeCompare(y);});
  const list=[];
  list.push({key:"__reception",label:"Reception",cls:"reception",people:[],reception:true});
  if(active) list.push({key:"__meeting",label:"Meeting Room",cls:"meetingroom",people:[{isCeo:true}].concat(inMeeting.map(a=>({a})))});
  const lead=groups["Leadership"]||[];
  const leadPeople=(active?[]:[{isCeo:true}]).concat(lead.map(a=>({a})));
  if(leadPeople.length) list.push({key:"Leadership",label:"Leadership",cls:"leadroom",people:leadPeople});
  depts.filter(d=>d!=="Leadership").forEach(d=>list.push({key:d,label:d,cls:"",people:groups[d].map(a=>({a}))}));
  list.push({key:"__break",label:"Staff Room",cls:"breakroom",people:[],breakroom:true});
  const layout=loadLayout();
  // simple wing layout: rooms flow left-to-right and wrap into rows, with a generous lane left
  // between rows for the shared hallway (buildCorridors runs a spine along the front of each row).
  const MAXROWW=2100, ROWGAP=84, COLGAP=34; let flowX=24, flowY=24, rowH=0;
  const placed=list.map((rm)=>{
    let pos=layout[rm.key];
    const size=isoRoomSize(rm);
    if(!pos){
      if(flowX+size.w>MAXROWW && flowX>24){ flowY+=rowH+ROWGAP; rowH=0; flowX=24; }
      pos={x:flowX, y:flowY};
      flowX += size.w+COLGAP;
      rowH=Math.max(rowH,size.h);
    }
    return {rm,pos,size};
  });
  const rooms=placed.map(({rm,pos})=>isoRoom(rm,pos)).join("");
  // canvas grows to fit the rooms + a margin for hallway props and lawn greenery
  const canvasW=Math.max(1200, Math.ceil(Math.max(...placed.map(p=>p.pos.x+p.size.w))+80));
  const canvasH=Math.max(520, Math.ceil(Math.max(...placed.map(p=>p.pos.y+p.size.h))+150));
  // shared hallways: a spine per row of rooms + a hall joining the rows (see buildCorridors)
  const {d:corridorD, props:corridorPropList}=buildCorridors(placed.map(pp=>({pos:pp.pos,size:pp.size})));
  const corridorLayer=placed.length>1?`<svg class="corridors" width="${canvasW}" height="${canvasH}" viewBox="0 0 ${canvasW} ${canvasH}"><path class="cway" d="${corridorD}"/><path class="cline" d="${corridorD}"/></svg>`:"";
  const cpropLayer=`<div class="cprops">${renderCorridorProps(corridorPropList)}</div>`;
  const tree=`<svg width="46" height="58" viewBox="0 0 46 58"><ellipse cx="23" cy="54" rx="15" ry="4" fill="rgba(0,0,0,.18)"/><rect x="20" y="36" width="6" height="16" fill="#5a3b22"/><ellipse cx="23" cy="28" rx="19" ry="16" fill="#2f6b2f"/><ellipse cx="15" cy="22" rx="11" ry="10" fill="#3a7d3a"/><ellipse cx="31" cy="24" rx="10" ry="9" fill="#347634"/></svg>`;
  const bush=`<svg width="34" height="24" viewBox="0 0 34 24"><ellipse cx="17" cy="21" rx="13" ry="3" fill="rgba(0,0,0,.15)"/><ellipse cx="11" cy="15" rx="8" ry="6" fill="#3a7d3a"/><ellipse cx="22" cy="15" rx="8" ry="6" fill="#347634"/><circle cx="9" cy="13" r="1.6" fill="#e2564d"/><circle cx="14" cy="16" r="1.6" fill="#f2b23d"/><circle cx="20" cy="13" r="1.6" fill="#d4537e"/><circle cx="24" cy="16" r="1.6" fill="#f2b23d"/><circle cx="17" cy="12" r="1.6" fill="#efe9d8"/></svg>`;
  // scatter greenery along the outer margin (below the last row + down the right side), out of the rooms
  const green=[];
  for(let i=0;i*150<canvasW-40;i++) green.push([24+i*150+((i*53)%46), canvasH-72+((i*29)%34), i%3===0]);
  for(let i=0;i*168<canvasH-160;i++) green.push([canvasW-70+((i*41)%26), 60+i*168+((i*67)%50), i%3===1]);
  const trees=`<div class="trees">${green.map(p=>`<div class="tree" style="left:${p[0]}px;top:${p[1]}px">${p[2]?bush:tree}</div>`).join("")}</div>`;
  const companyName=(ORG.companyName||"").trim()||"HQ";
  const banner=`<div class="hqsign" id="hqsign" title="Click to rename">🏢 ${esc(companyName)}${ORG.vision?` <span class="dim">— ${esc(ORG.vision.slice(0,60))}${ORG.vision.length>60?'…':''}</span>`:''}</div>`;
  return `<div class="floorwrap">${banner}<div class="floorplan" style="width:${canvasW}px;height:${canvasH}px">${trees}${corridorLayer}${cpropLayer}${rooms}</div></div>`;
}
// Render the hallway props (potted plants / waiting benches) at the positions buildCorridors
// picked — i.e. sitting ON the shared spine, between rooms. The clutter that makes TH halls
// feel lived-in. Positions come precomputed so they track rooms on drag (see redrawCorridors).
function renderCorridorProps(props){
  const pot=`<svg width="18" height="26" viewBox="0 0 18 26"><ellipse cx="9" cy="24" rx="7" ry="2.4" fill="rgba(0,0,0,.22)"/><path d="M4 17 h10 l-1.4 7 h-7.2 z" fill="#b06a3a" stroke="#7a4522" stroke-width="0.6"/><ellipse cx="9" cy="12" rx="7" ry="7" fill="#3a7d3a"/><ellipse cx="5.5" cy="9" rx="4" ry="4" fill="#4c9440"/><ellipse cx="12" cy="10" rx="3.6" ry="3.6" fill="#347634"/></svg>`;
  const bench=`<svg width="30" height="20" viewBox="0 0 30 20"><ellipse cx="15" cy="18" rx="13" ry="2.4" fill="rgba(0,0,0,.2)"/><rect x="3" y="9" width="24" height="4" rx="1" fill="#8a6a3a" stroke="#5c451f" stroke-width="0.6"/><rect x="3" y="4" width="24" height="3" rx="1" fill="#9a7a4a"/><rect x="5" y="12" width="2.5" height="5" fill="#5c451f"/><rect x="22" y="12" width="2.5" height="5" fill="#5c451f"/></svg>`;
  return (props||[]).map(pr=>{
    const isBench=pr.kind===1, prop=isBench?bench:pot, w=isBench?30:18, h=isBench?20:26;
    return `<div class="cprop" style="left:${(pr.x-w/2).toFixed(1)}px;top:${(pr.y-h+4).toFixed(1)}px">${prop}</div>`;
  }).join("");
}
function redrawCorridors(container){
  const svg=container.querySelector(".corridors"); if(!svg) return;
  const rooms=[...container.querySelectorAll(".isoroom")];
  const items=rooms.map(el=>({
    pos:{x:parseFloat(el.style.left)||0, y:parseFloat(el.style.top)||0},
    size:{w:parseFloat(el.style.width)||264, h:parseFloat(el.querySelector(".roomscene").style.height)||160},
  }));
  const {d, props}=buildCorridors(items);
  svg.innerHTML=`<path class="cway" d="${d}"/><path class="cline" d="${d}"/>`;
  const pl=container.querySelector(".cprops"); if(pl) pl.innerHTML=renderCorridorProps(props);
}
// Drag-to-pan ("hand tool"): hold the left button on empty space and drag to scroll a container,
// instead of hunting for scrollbars. `skipSel` elements keep their own drag/click behaviour.
function enableDragScroll(el, skipSel){
  if(!el || el._dragScroll) return; el._dragScroll=true;
  let down=false, moved=false, sx=0, sy=0, sl=0, st=0, pid=null;
  el.addEventListener("pointerdown",(e)=>{
    if(e.button!==0) return;                                    // left button = the normal pan gesture
    if(skipSel && e.target.closest(skipSel)) return;            // characters / signs / buttons act as themselves
    if(e.target.closest("input,textarea,select,button,a,[contenteditable]")) return;
    down=true; moved=false; sx=e.clientX; sy=e.clientY; sl=el.scrollLeft; st=el.scrollTop; pid=e.pointerId;
  });
  el.addEventListener("pointermove",(e)=>{
    if(!down) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(!moved){ if(Math.abs(dx)+Math.abs(dy)<=4) return; moved=true; el.classList.add("grabbing"); try{el.setPointerCapture(pid);}catch{} }
    el.scrollLeft=sl-dx; el.scrollTop=st-dy; e.preventDefault();
  });
  const end=()=>{ if(!down) return; down=false;
    if(moved){ el.classList.remove("grabbing"); try{el.releasePointerCapture(pid);}catch{}
      const kill=(ev)=>{ ev.stopPropagation(); ev.preventDefault(); };   // swallow the click a drag would otherwise fire
      el.addEventListener("click",kill,true); setTimeout(()=>el.removeEventListener("click",kill,true),0);
    }
    moved=false;
  };
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end);
}

function wireFloor(container){
  const fw=container.classList&&container.classList.contains("floorwrap")?container:container.querySelector(".floorwrap");
  if(fw) enableDragScroll(fw, ".rchar,.roomsign,.roompaint,.hqsign");
  const sign=container.querySelector("#hqsign")||document.getElementById("hqsign");
  if(sign) sign.onclick=async()=>{
    const cur=(ORG.companyName||"").trim();
    const name=prompt("Name your company:",cur||"");
    if(name==null) return;
    await api("POST","/api/company",{name:name.trim()});
    ORG=await api("GET","/api/org");
    const ob=document.getElementById("orgbody"); if(ob){ ob.innerHTML=officeHTML(); wireFloor(ob); paintStatus(); }
  };
  container.querySelectorAll(".isoroom").forEach(room=>{
    const sign=room.querySelector(".roomsign");
    let drag=false,sx,sy,ox,oy;
    sign.addEventListener("pointerdown",(e)=>{ drag=true; try{sign.setPointerCapture(e.pointerId);}catch{} sx=e.clientX; sy=e.clientY; ox=parseFloat(room.style.left)||0; oy=parseFloat(room.style.top)||0; room.style.zIndex=80; });
    sign.addEventListener("pointermove",(e)=>{ if(!drag)return; room.style.left=Math.max(0,ox+e.clientX-sx)+"px"; room.style.top=Math.max(0,oy+e.clientY-sy)+"px"; redrawCorridors(container); });
    const end=()=>{ if(!drag)return; drag=false; room.style.zIndex=""; saveRoomPos(room.dataset.dept, parseFloat(room.style.left)||0, parseFloat(room.style.top)||0); redrawCorridors(container); };
    sign.addEventListener("pointerup",end); sign.addEventListener("pointercancel",end);
    const paint=room.querySelector(".roompaint");
    if(paint){ paint.addEventListener("pointerdown",(e)=>e.stopPropagation());
      paint.addEventListener("click",(e)=>{ e.stopPropagation(); const s=loadStyle(); s[room.dataset.dept]=(((s[room.dataset.dept]??-1)+1)%FLOOR_PALETTES.length); localStorage.setItem("bureau_style",JSON.stringify(s)); const ob=document.getElementById("orgbody"); if(ob){ ob.innerHTML=officeHTML(); wireFloor(ob); paintStatus(); } }); }
  });
  const recNpc=container.querySelector('.rchar.npc[data-reception-npc]');
  if(recNpc) recNpc.onclick=()=>openTalkToHR();
  container.querySelectorAll(".rchar[data-node]").forEach(ch=>{
    let dxp,dyp,moved=false,dragging=false;
    ch.addEventListener("pointerdown",(e)=>{ dragging=true; moved=false; dxp=e.clientX; dyp=e.clientY; try{ch.setPointerCapture(e.pointerId);}catch{} e.preventDefault(); });
    ch.addEventListener("pointermove",(e)=>{ if(!dragging)return; const mx=e.clientX-dxp,my=e.clientY-dyp; if(!moved&&Math.abs(mx)+Math.abs(my)>6){ moved=true; ch.classList.add("dragging"); } if(moved){ ch.style.transform=`translate(${mx}px,${my}px)`; ch.style.zIndex=999; } });
    const up=(e)=>{ if(!dragging)return; dragging=false;
      if(!moved){ const a=ORG.agents.find(x=>x.id===ch.dataset.node); if(a) openAgentModal("edit",a); return; }
      ch.style.pointerEvents="none"; const el=document.elementFromPoint(e.clientX,e.clientY); ch.style.pointerEvents="";
      const room=el&&el.closest?el.closest(".isoroom"):null, toDept=room?room.dataset.dept:null;
      const agent=ORG.agents.find(x=>x.id===ch.dataset.node), curDept=agent?(agent.department||"General"):null;
      ch.classList.remove("dragging"); ch.style.transform=""; ch.style.zIndex="";
      if(toDept && toDept!=="__meeting" && agent && toDept!==curDept){
        const fromRect=ch.getBoundingClientRect(); relocateAgent(agent.id,toDept,fromRect);
      }
      else { const ob=document.getElementById("orgbody"); if(ob){ ob.innerHTML=officeHTML(); wireFloor(ob); paintStatus(); } }
    };
    ch.addEventListener("pointerup",up); ch.addEventListener("pointercancel",up);
  });
}
// On drop: a flying clone glides from the drop point into the new room, so a relocation

async function relocateAgent(id,toDept,fromRect){
  const agent=ORG.agents.find(x=>x.id===id);
  let r=null; try{ r=await api("POST",`/api/agents/${id}/relocate`,{toDepartment:toDept}); }catch{}

    clone.innerHTML=`<img src="${ASET}${skinFor(agent.seed)}.png" style="width:${PERSON_W.toFixed(1)}px;display:block">`;
    clone.style.left=(fromRect.left)+"px"; clone.style.top=(fromRect.top)+"px";
    document.body.appendChild(clone);
    const ob=document.getElementById("orgbody"); if(ob){ ob.innerHTML=officeHTML(); wireFloor(ob); paintStatus(); }
    const dest=[...document.querySelectorAll(".rchar[data-node]")].find(n=>n.dataset.node===id);

      requestAnimationFrame(()=>{ clone.style.transition="left .5s cubic-bezier(.3,.7,.4,1), top .5s cubic-bezier(.3,.7,.4,1), transform .5s"; clone.style.left=dr.left+"px"; clone.style.top=dr.top+"px"; clone.style.transform="scale(0.94)"; });
      setTimeout(()=>{ clone.remove(); dest.style.visibility=""; if(r&&r.question) openRelocateDialog(id,r); }, 520);
    } else { clone.remove(); if(r&&r.question) openRelocateDialog(id,r); }
  } else {
    const ob=document.getElementById("orgbody"); if(ob){ ob.innerHTML=officeHTML(); wireFloor(ob); paintStatus(); }
    if(r&&r.question) openRelocateDialog(id,r);
  }
}

function mdLite(src){
  const e2=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return e2(src)
    .replace(/^#### (.*)$/gm,"<h4>$1</h4>").replace(/^### (.*)$/gm,"<h3>$1</h3>")
    .replace(/^## (.*)$/gm,"<h2 style='text-transform:none;letter-spacing:0;font-size:16px'>$1</h2>").replace(/^# (.*)$/gm,"<h1 style='font-size:20px'>$1</h1>")
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g,"$1<em>$2</em>")
    .replace(/^\s*[-*] (.*)$/gm,"<li>$1</li>").replace(/(<li>[\s\S]*?<\/li>)/g,"<ul>$1</ul>")
    .replace(/\n{2,}/g,"<br><br>").replace(/\n/g,"<br>");
}

// Compact line-level diff (LCS) for the version view. Guarded against very large docs.
function lineDiff(oldT, newT){
  const a=String(oldT).split("\n"), b=String(newT).split("\n"), n=a.length, m=b.length;
  if(n>500||m>500) return [{t:"=",l:"(document too large to diff — showing current version)"}].concat(b.map(l=>({t:"=",l})));
  const dp=Array.from({length:n+1},()=>new Int32Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[]; let i=0,j=0;
  while(i<n&&j<m){ if(a[i]===b[j]){out.push({t:"=",l:a[i]});i++;j++;} else if(dp[i+1][j]>=dp[i][j+1]){out.push({t:"-",l:a[i]});i++;} else {out.push({t:"+",l:b[j]});j++;} }
  while(i<n) out.push({t:"-",l:a[i++]}); while(j<m) out.push({t:"+",l:b[j++]});
  return out;
}

async function openDeliverable(name){

    dlFile(doc,name.replace(/\.[a-z0-9]+$/i,"")+".html","text/html");
  };
  wrap.querySelectorAll("[data-st]").forEach(b=>b.onclick=async()=>{ await api("POST","/api/deliverables/"+encodeURIComponent(name)+"/status",{status:b.dataset.st}); wrap.remove(); loadDeliverables(); loadDashboard(); refreshInbox(); });
  const delBtn=wrap.querySelector("#delDeliv");

    // Deliberately does NOT say "cannot be undone" — it can. The server archives into version history,
    // so promising permanence would be a lie, and overstating danger makes people distrust the wording.
    if(!confirm(`Remove "${name}"?\n\nIt is ARCHIVED, not destroyed: the content is kept in version history and the removal is recorded in the audit log (🧾 Log), so it can be recovered.\n\nIt stops appearing in the deliverables list and agents stop citing it in their work.`)) return;
    const r=await api("DELETE","/api/deliverables/"+encodeURIComponent(name));

async function loadPurchases(){
  const box=document.getElementById("purchases"); if(!box) return;
  let data; try{ data=await api("GET","/api/purchases"); }catch{ box.innerHTML=`<div class="dim">Couldn't load purchases.</div>`; return; }
  const funds=data.funds||0, spent=data.spent||0, rem=Math.round((funds-spent)*100)/100, list=data.purchases||[];
  const head = funds>0
    ? `<div class="dim" style="font-size:11px;margin-bottom:2px">Budget ${fmtUsd(funds)} · spent ${fmtUsd(spent)} · remaining <b style="color:${rem<0?'var(--danger)':'var(--ink)'}">${fmtUsd(rem)}</b></div>`
    : `<div class="dim">No purchasing budget set. Click “Set budget” — then agents can propose purchases you approve in Latch/Compass.</div>`;
  const rows = list.length ? list.map(pp=>`<div class="delivrow" style="cursor:default"><span>🛒</span><span style="flex:1;min-width:0"><span class="dn" style="display:block;white-space:normal">${esc(pp.item)}</span><span class="dim" style="font-size:11px">${esc(pp.why||"")}${pp.by?` · ${esc(pp.by)}`:""} · ${new Date(pp.at).toLocaleDateString()}</span></span><span class="dm">${fmtUsd(pp.cost)}</span></div>`).join("") : (funds>0?`<div class="dim">No purchases yet.</div>`:"");
  box.innerHTML=head+rows;
}
const CADENCE_LABEL={hourly:"every hour",daily:"every day",weekly:"every week"};
async function loadGoals(){
  const box=document.getElementById("goals"); if(!box) return;
  let data; try{ data=await api("GET","/api/goals"); }catch{ box.innerHTML=`<div class="dim">Couldn't load goals.</div>`; return; }
  const list=(data&&data.goals)||[];
  if(!list.length){ box.innerHTML=`<div class="dim">No goals yet. Add a company goal — Bureau can work toward it and track progress.</div>`; return; }
  box.innerHTML=list.map(g=>{
    const krs=g.keyResults||[], done=krs.filter(k=>k.done).length, pct=krs.length?Math.round(done/krs.length*100):(g.status==="done"?100:0);
    const runs=(g.runs||[]).slice(0,6), stcls=g.status==="done"?"delivered":g.status==="paused"?"draft":"qa";
    return `<div class="goalcard" data-id="${esc(g.id)}">
      <div class="row" style="justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="min-width:0;flex:1"><div class="gtitle">${g.hush?`<span title="hush — local model only">🤫 </span>`:""}${esc(g.title)} <span class="stbadge ${stcls}">${esc(g.status)}</span>${g.cadence&&g.cadence!=="off"?` <span class="stbadge qa" title="auto-advances ${esc(g.cadence)}">⏱ ${esc(g.cadence)}</span>`:""}</div>${g.detail?`<div class="dim" style="font-size:11px;margin-top:2px">${esc(g.detail)}</div>`:""}</div>
        <div class="row" style="gap:6px;flex:none"><button class="miniadd gwork">▶ Work on it</button><button class="miniadd gedit">Edit</button></div>
      </div>
      ${krs.length?`<div class="gbar"><div class="gbarfill" style="width:${pct}%"></div></div>
        <div class="dim" style="font-size:10px;margin:3px 0 5px">${done}/${krs.length} key results · ${pct}%</div>
        <div class="krlist">${krs.map(k=>`<label class="krchk"><input type="checkbox" data-kr="${k.id}" ${k.done?"checked":""}><span>${esc(k.text)}</span></label>`).join("")}</div>`:`<div class="dim" style="font-size:10px;margin-top:4px">No key results yet — add some to track progress.</div>`}
      ${runs.length?`<div class="grow">${runs.map(r=>`<span class="rdotv ${esc(r.verdict||"")}" title="${esc(r.objective||"")} — ${esc(r.verdict||"")}"></span>`).join("")}<span class="dim" style="font-size:10px;margin-left:5px">${runs.length} run${runs.length===1?"":"s"} toward this</span></div>`:""}
      ${g.retro&&g.retro.text?`<div class="dim" style="font-size:11px;margin-top:7px;border-top:1px dashed var(--line-2);padding-top:6px">📓 <b style="font-weight:600">Retrospective</b> — ${esc(g.retro.text)}</div>`:""}
    </div>`;
  }).join("");
  box.querySelectorAll(".goalcard").forEach(card=>{
    const id=card.dataset.id;
    card.querySelector(".gwork").onclick=()=>launchGoalRun(id);
    card.querySelector(".gedit").onclick=()=>openGoalDialog(list.find(x=>x.id===id));
    card.querySelectorAll("input[data-kr]").forEach(cb=>cb.onclick=async()=>{
      const g=list.find(x=>x.id===id);
      const krs=(g.keyResults||[]).map(k=>({text:k.text, done: String(k.id)===cb.dataset.kr ? cb.checked : !!k.done}));
      await api("PATCH","/api/goals/"+id,{keyResults:krs}); loadGoals(); loadDashboard();
    });
  });
}

const PLAN_ST={todo:"draft",doing:"qa",blocked:"draft",done:"delivered"};
// The queue exists so nobody is ever waiting on an answer: every question in it already has an assumption the work
// proceeded on, so answering is a CORRECTION rather than an unblock. That is what makes it safe to leave several open
// and answer them together.
async function loadQuestions(){
  const box=document.getElementById("questions"); if(!box) return;
  let data; try{ data=await api("GET","/api/questions"); }catch{ box.innerHTML=`<div class="dim">Couldn't load the questions.</div>`; return; }
  const list=(data&&data.questions)||[];
  const open=list.filter(q=>q.status==="open"), done=list.filter(q=>q.status==="answered");
  if(!list.length){ box.innerHTML=`<div class="dim">No questions. An agent queues one here when only you can settle something — a scope call, a policy choice, a number nobody wrote down. Nothing waits on it: the work carries on under a stated assumption, and your answer corrects it.</div>`; return; }
  box.innerHTML=open.map(q=>`<div class="goalcard" data-id="${esc(q.id)}">
      <div class="gtitle">${esc(q.question)}${q.asked>1?` <span class="dim" style="font-size:11px">· asked ${q.asked}×</span>`:""}</div>
      <div class="dim" style="font-size:11px;margin-top:3px">Proceeding as if: <b>${esc(q.assumption)}</b>${q.affects?` · written in ${esc(q.affects)}`:""}${q.by?` · ${esc(q.by)}`:""}</div>
      <div class="row" style="gap:6px;margin-top:7px"><input class="qans" placeholder="Your answer — it becomes a standing decision" style="flex:1;min-width:0"><button class="miniadd qsave">Answer</button></div>
      <div class="row" style="gap:6px;margin-top:3px"><button class="miniadd qdrop" style="opacity:.7">Drop it</button><span class="dim" style="font-size:11px">— it was moot, or you settled it in person</span></div>
      <div class="dim qmsg" style="font-size:11px;margin-top:4px"></div>
    </div>`).join("")
    + (done.length?`<div class="dim" style="font-size:11px;margin-top:10px;border-top:1px dashed var(--line-2);padding-top:7px">Settled, and applied by every run from now on:<br>${done.slice(0,8).map(q=>`· ${esc(q.question)} → <b>${esc(q.answer)}</b>`).join("<br>")}</div>`:"");
  box.querySelectorAll(".goalcard").forEach(card=>{
    const id=card.dataset.id, inp=card.querySelector(".qans"), msg=card.querySelector(".qmsg");
    const save=async()=>{
      const answer=inp.value.trim(); if(!answer){ msg.textContent="An empty answer is not an answer."; return; }
      try{ await api("POST","/api/questions/"+encodeURIComponent(id)+"/answer",{answer}); loadQuestions(); }
      catch(e){ msg.textContent="Couldn't save that: "+(e&&e.message||"failed"); }
    };
    card.querySelector(".qsave").onclick=save;
    card.querySelector(".qdrop").onclick=async()=>{ if(!confirm("Drop this question? The work already proceeded on its assumption.")) return;
      try{ await api("DELETE","/api/questions/"+encodeURIComponent(id)); loadQuestions(); }catch(e){ msg.textContent="Couldn't drop it: "+(e&&e.message||"failed"); } };
    inp.onkeydown=(e)=>{ if(e.key==="Enter") save(); };
  });
}

async function loadTriggers(){
  const box=document.getElementById("triggers"); if(!box) return;
  let data; try{ data=await api("GET","/api/triggers"); }catch{ box.innerHTML=`<div class="dim">Couldn't load triggers.</div>`; return; }
  const list=(data&&data.triggers)||[];
  if(!list.length){ box.innerHTML=`<div class="dim">No triggers. Create one to let an external event (a webhook POST) start a run.</div>`; return; }
  box.innerHTML=list.map(t=>{
    const url=location.origin+"/api/trigger/"+t.token;
    return `<div class="delivrow" style="cursor:default;align-items:flex-start"><span>${t.enabled?"⚡":"⏸️"}</span><span style="flex:1;min-width:0"><span class="dn" style="display:block">${t.hush?`<span title="hush — local model only">🤫 </span>`:""}${esc(t.name)}${t.fires?` <span class="dim" style="font-weight:400">· fired ${t.fires}×</span>`:""}</span><span class="dim" style="font-size:11px;display:block;white-space:normal">${esc(t.objective.slice(0,80))}${t.objective.length>80?"…":""}</span><span style="font-size:10px;display:flex;gap:6px;align-items:center;margin-top:4px"><code style="font-size:10px;overflow:hidden;text-overflow:ellipsis;max-width:210px;white-space:nowrap;color:var(--ink-3)">${esc(url)}</code><button class="rvbtn tcopy" data-u="${esc(url)}">copy URL</button></span></span><span class="row" style="gap:6px;flex:none"><button class="rvbtn ttoggle" data-id="${t.id}" data-en="${t.enabled?1:0}">${t.enabled?"Pause":"Enable"}</button><button class="rvbtn tdel" data-id="${t.id}">Delete</button></span></div>`;
  }).join("");
  box.querySelectorAll(".tcopy").forEach(b=>b.onclick=()=>{ try{ navigator.clipboard.writeText(b.dataset.u); }catch{} b.textContent="copied ✓"; setTimeout(()=>b.textContent="copy URL",1200); });
  box.querySelectorAll(".ttoggle").forEach(b=>b.onclick=async()=>{ await api("PATCH","/api/triggers/"+b.dataset.id,{enabled:b.dataset.en!=="1"}); loadTriggers(); });
  box.querySelectorAll(".tdel").forEach(b=>b.onclick=async()=>{ if(confirm("Delete this trigger?")){ await api("DELETE","/api/triggers/"+b.dataset.id); loadTriggers(); } });

async function loadSchedules(){
  const box=document.getElementById("schedules"); if(!box) return;
  let data; try{ data=await api("GET","/api/schedules"); }catch{ box.innerHTML=`<div class="dim">Couldn't load schedules.</div>`; return; }
  const list=(data&&data.schedules)||[];
  if(!list.length){ box.innerHTML=`<div class="dim">No schedules. Add one and the company runs it automatically (scheduled runs auto-approve their actions).</div>`; return; }
  box.innerHTML=list.map(s=>{ const who=s.mode==="company"?"whole company":((ORG.agents.find(a=>a.id===s.agentId)||{}).name||"an agent");
    const next=s.enabled?`next ${new Date(s.nextRunAt).toLocaleString()}`:"paused";
    return `<div class="delivrow" style="cursor:default"><span>${s.enabled?"⏱️":"⏸️"}</span>
      <span style="flex:1;min-width:0"><span class="dn" style="display:block;white-space:normal">${s.hush?`<span title="hush — local model only">🤫 </span>`:""}${esc(s.objective)}</span><span class="dim" style="font-size:11px">${CADENCE_LABEL[s.cadence]||s.cadence} · ${esc(who)} · ${next}${s.hush?" · local only":""}</span></span>
      <button class="rvbtn" data-act="run" data-id="${s.id}">Run now</button>
      <button class="rvbtn" data-act="toggle" data-id="${s.id}" data-en="${s.enabled?1:0}">${s.enabled?"Pause":"Resume"}</button>
      <button class="rvbtn" data-act="del" data-id="${s.id}" title="Delete">✕</button></div>`;
  }).join("");
  box.querySelectorAll(".rvbtn").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.id, act=b.dataset.act;
    if(act==="run"){ b.textContent="…"; await api("POST","/api/schedules/"+id+"/run",{}); b.textContent="Run now"; }
    else if(act==="toggle"){ await api("PATCH","/api/schedules/"+id,{enabled:b.dataset.en!=="1"}); loadSchedules(); }
    else if(act==="del"){ if(confirm("Delete this schedule?")){ await api("DELETE","/api/schedules/"+id); loadSchedules(); } }
  });
}

async function loadSops(){
